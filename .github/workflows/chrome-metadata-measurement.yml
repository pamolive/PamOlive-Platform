name: P1-G Chrome repository metadata measurement
on:
  push:
    branches: [agent/p1g-chrome-metadata-refresh]
permissions:
  contents: read
jobs:
  authenticated-metadata:
    if: github.repository == 'pamolive/PamOlive-Platform'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - name: Verify metadata intake contracts
        run: python3 -B -m unittest qualification.p1g_headless.test_chrome_metadata
      - name: Authenticate the public index and inventory the exact package without installing it
        run: python3 -I -B -S qualification/p1g_headless/chrome_metadata.py --inventory-only
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: p1g-chrome-metadata-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/pamolive-chrome-metadata-${{ github.run_id }}-${{ github.run_attempt }}/metadata-receipt.json
            ${{ runner.temp }}/pamolive-chrome-metadata-${{ github.run_id }}-${{ github.run_attempt }}/Release
            ${{ runner.temp }}/pamolive-chrome-metadata-${{ github.run_id }}-${{ github.run_attempt }}/Release.gpg
            ${{ runner.temp }}/pamolive-chrome-metadata-${{ github.run_id }}-${{ github.run_attempt }}/Packages
            ${{ runner.temp }}/pamolive-chrome-metadata-${{ github.run_id }}-${{ github.run_attempt }}/bundle-inventory.json
          if-no-files-found: error
          retention-days: 7
