name: Cairo headless Trixie qualification

on:
  push:
    branches: [agent/cairo-headless-qualification]

permissions:
  contents: read

jobs:
  cairo-trixie-amd64:
    if: github.repository == 'pamolive/PamOlive-Platform'
    runs-on: ubuntu-24.04
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - name: Rebuild Cairo without X and compare the headless renderer
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          umask 077
          archive="$RUNNER_TEMP/pamolive-cairo-context-$GITHUB_RUN_ID.tar"
          context="$RUNNER_TEMP/pamolive-cairo-context-$GITHUB_RUN_ID"
          evidence="$RUNNER_TEMP/pamolive-cairo-evidence-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          test ! -e "$evidence"
          (
            set -o noclobber
            git archive "$GITHUB_SHA" qualification/cairo_headless qualification/x11_trixie_build/check.py > "$archive"
          )
          mkdir -m 700 "$context"
          tar --extract --file "$archive" --directory "$context" --no-same-owner
          docker build --platform=linux/amd64 --no-cache --progress=plain \
            --target cairo-qualification --output "type=local,dest=$evidence" \
            --file "$context/qualification/cairo_headless/Dockerfile" "$context"
          cmp <(find "$evidence" -mindepth 1 -printf '%f\n' | LC_ALL=C sort) - <<'EXPECTED'
          baseline.json
          buildinfo
          candidate.json
          libcairo-gobject2.deb
          libcairo-script-interpreter2.deb
          libcairo2-dev.deb
          libcairo2.deb
          qualification.json
          sdk-result.txt
          EXPECTED
          printf '%s\n' 'build: OK' 'run: OK' | cmp "$evidence/sdk-result.txt" -
          python3 -I -B -S "$context/qualification/cairo_headless/check.py" compare "$evidence" \
            | cmp "$evidence/qualification.json" -
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: cairo-headless-qualification-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pamolive-cairo-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 7
