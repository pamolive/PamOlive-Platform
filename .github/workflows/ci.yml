name: Platform checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install the isolated security toolchain
        run: |
          python -m pip install --only-binary=:all: --no-deps --require-hashes -r requirements-bootstrap.lock
          python -m pip install -r requirements-security.lock
          python -m pip check
      - name: Verify native inventory and SBOM qualification tools
        run: python -m unittest tests.test_native_inventory tests.test_native_sbom tests.test_native_dns tests.test_image_scan_policy tests.test_database_driver tests.test_ldap_fixture_permissions tests.test_krb5_inventory tests.test_krb5_acquisition tests.test_krb5_sbom tests.test_scan_scratch tests.test_build_recipe tests.test_build_context tests.test_runtime_environment tests.test_secret_baseline_metadata tests.test_python_materials tests.test_python_materials_resilience tests.test_ensurepip_bundle tests.test_expat_product tests.test_jansson_image_absence tests.test_jansson_input_binding tests.test_jansson_sbom tests.test_jansson_ci_evidence tests.test_jansson_oracle_identity tests.test_native_migration_composition
      - name: Verify closed public restore report projection
        run: python -m unittest tests.test_restore_public_report
      - name: Verify public metadata projections without Engine or network
        run: python -I -S -B qualification/public_engine_measurement/run_pure.py
      - name: Verify the confined public PostgreSQL identity owner without Docker
        run: python -I -S -B qualification/public_pg_identity_probe/run_pure.py
      - name: Verify portable reviewed secret metadata before the unchanged secret scan
        run: python -m deploy.check_secret_baseline .secrets.baseline
      - name: Reject known vulnerabilities in the application lock
        run: python -m pip_audit --strict --no-deps --disable-pip -r requirements.lock -f json -o "$RUNNER_TEMP/pamolive-dependency-audit.json"
      - name: Reject known vulnerabilities in the seven P2 library build and test materials
        run: python -m pip_audit --strict --no-deps --disable-pip -r requirements-bootstrap.lock -r requirements-python-build-tools-linux.lock -r requirements-p2-test-linux.lock -f json -o "$RUNNER_TEMP/pamolive-p2-materials-audit.json"
      - name: Reject known vulnerabilities in the thirteen public PAM verifier materials
        run: >-
          python -m pip_audit --strict --no-deps --disable-pip
          -r qualification/pam_trust_verifier/requirements-bootstrap.lock
          -r qualification/pam_trust_verifier/requirements-build.lock
          -r qualification/pam_trust_verifier/requirements-runtime.lock
          -f json -o "$RUNNER_TEMP/pamolive-public-verifier-materials-audit.json"
      - name: Reject known vulnerabilities in the isolated browser test tools
        run: >-
          python -m pip_audit --strict --no-deps --disable-pip
          -r qualification/p1g_headless/requirements-headless-linux-cp312.lock
          -f json -o "$RUNNER_TEMP/pamolive-headless-tools-audit.json"
      - name: Produce the application CycloneDX SBOM
        if: always()
        run: python -m pip_audit --strict --no-deps --disable-pip -r requirements.lock -f cyclonedx-json -o "$RUNNER_TEMP/pamolive-sbom.cdx.json"
      - name: Reject medium and high severity application findings
        if: always()
        run: python -m bandit -r config platform_core platform_modules components/vault/src components/vault/runtime/pamolive_vault_runtime components/vault-registry/src components/pam-trust-verifier/src components/usage-anchor/pamolive_usage_anchor -ll -f json -o "$RUNNER_TEMP/pamolive-bandit-application.json"
      - name: Retain all deployment and browser bootstrap findings for review
        if: always()
        run: python -m bandit -r deploy qualification/p1g_headless/chrome_bootstrap.py qualification/p1g_headless/chrome_gpg.py qualification/p1g_headless/chrome_key_scope.py qualification/p1g_headless/chrome_key_scope_native.py qualification/p1g_headless/gpg_fixture --exit-zero -f json -o "$RUNNER_TEMP/pamolive-bandit-deploy-all.json"
      - name: Reject high severity deployment and browser bootstrap findings
        if: always()
        run: python -m bandit -r deploy qualification/p1g_headless/chrome_bootstrap.py qualification/p1g_headless/chrome_gpg.py qualification/p1g_headless/chrome_key_scope.py qualification/p1g_headless/chrome_key_scope_native.py qualification/p1g_headless/gpg_fixture -lll -f json -o "$RUNNER_TEMP/pamolive-bandit-deploy-high.json"
      - name: Reject new secrets against the reviewed baseline without network verification
        if: always()
        shell: bash
        run: |
          set -o pipefail
          test -f .secrets.baseline
          mkdir -p "$RUNNER_TEMP/pamolive-secret-check"
          cp .secrets.baseline "$RUNNER_TEMP/pamolive-secret-check/.secrets.baseline"
          git ls-files -z | xargs -0 -r python -m detect_secrets.pre_commit_hook --no-verify --json --baseline "$RUNNER_TEMP/pamolive-secret-check/.secrets.baseline"
      - name: Remove source and diagnostic text from Bandit artifacts
        id: redact
        if: always()
        run: >-
          python -m deploy.redact_security_reports
          "$RUNNER_TEMP/pamolive-bandit-application.json"
          "$RUNNER_TEMP/pamolive-bandit-deploy-all.json"
          "$RUNNER_TEMP/pamolive-bandit-deploy-high.json"
      - name: Retain security reports
        if: always() && steps.redact.conclusion == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: pamolive-security-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/pamolive-dependency-audit.json
            ${{ runner.temp }}/pamolive-p2-materials-audit.json
            ${{ runner.temp }}/pamolive-public-verifier-materials-audit.json
            ${{ runner.temp }}/pamolive-headless-tools-audit.json
            ${{ runner.temp }}/pamolive-sbom.cdx.json
            ${{ runner.temp }}/pamolive-bandit-application.json
            ${{ runner.temp }}/pamolive-bandit-deploy-all.json
            ${{ runner.temp }}/pamolive-bandit-deploy-high.json
          if-no-files-found: warn
          retention-days: 7
  postgres-and-container:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    services:
      postgres:
        image: docker.io/library/postgres@sha256:6f7593c161689b6b02c78668b314af7da8811b592c5519108c57a49d0b6ad788 # 17.12, linux/amd64
        env:
          POSTGRES_USER: pamolive
          POSTGRES_PASSWORD: ci-only-database-password
          POSTGRES_DB: pamolive
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://pamolive:ci-only-database-password@127.0.0.1:5432/pamolive
      SECRET_KEY: ci-only-secret-not-used-outside-isolated-ci-jobs
      PAMOLIVE_ENCRYPTION_KEY: ci-only-encryption-key-not-used-outside-isolated-ci-jobs
      PAMOLIVE_TEST_DATABASE_NAME: test_pamolive_ci
      PAMOLIVE_LDAP_FIXTURE_PARENT: /var/lib/ldap/pamolive-fixtures-${{ github.run_id }}-${{ github.run_attempt }}
      PSYCOPG_IMPL: c
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install native directory build and isolated wire-test prerequisites
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends build-essential libldap2-dev libsasl2-dev libpq-dev slapd ldap-utils ripgrep acl
      - name: Prepare a new private LDAP fixture area under the existing confined database path
        id: ldap_fixture
        shell: bash
        run: |
          set -euo pipefail
          [[ "$PAMOLIVE_LDAP_FIXTURE_PARENT" =~ ^/var/lib/ldap/pamolive-fixtures-[1-9][0-9]{0,19}-[1-9][0-9]{0,3}$ ]]
          test "$(readlink -f /var/lib/ldap)" = /var/lib/ldap
          test ! -e "$PAMOLIVE_LDAP_FIXTURE_PARENT"
          acl_backup="$RUNNER_TEMP/pamolive-ldap-parent.acl"
          parent_acl_saved=false
          restore_failed_setup() {
            status=$?
            if test "$status" != 0 && test "$parent_acl_saved" = true; then
              sudo setfacl --restore="$acl_backup"
              sudo getfacl -p /var/lib/ldap | cmp - "$acl_backup"
            fi
            return "$status"
          }
          trap restore_failed_setup EXIT
          sudo /usr/bin/python3 -I "$GITHUB_WORKSPACE/deploy/check_ldap_fixture_permissions.py" --actor-uid "$(id -u)" --actor-groups "$(id -G | tr ' ' ',')"
          umask 077
          (set -o noclobber; sudo getfacl -p /var/lib/ldap > "$acl_backup")
          parent_acl_saved=true
          printf 'acl_saved=true\n' >> "$GITHUB_OUTPUT"
          if ! test -x /var/lib/ldap; then
            sudo setfacl -m "u:$(id -u):--x" /var/lib/ldap
          fi
          test -x /var/lib/ldap
          test ! -r /var/lib/ldap
          test ! -w /var/lib/ldap
          sudo install -d -m 700 -o "$(id -u)" -g "$(id -g)" "$PAMOLIVE_LDAP_FIXTURE_PARENT"
          printf 'created=true\n' >> "$GITHUB_OUTPUT"
          if test -f /etc/apparmor.d/usr.sbin.slapd; then
            rg -n '/var/(lib/ldap|tmp)' /etc/apparmor.d/usr.sbin.slapd
          fi
      - name: Install locked application and qualification dependencies
        run: |
          python -m pip install --only-binary=:all: --no-deps --require-hashes -r requirements-bootstrap.lock
          python -m pip install --only-binary=:all: --no-deps --require-hashes -r requirements-native-build.lock
          python -m pip wheel --no-build-isolation --no-deps --require-hashes --wheel-dir "$RUNNER_TEMP/pamolive-database-wheels" -r requirements-database-build.lock
          python -m pip install --find-links="$RUNNER_TEMP/pamolive-database-wheels" -r requirements-dev.lock -r requirements-security.lock
      - run: python -m pip check
      - name: Require the pinned PostgreSQL 17.12 server before regressions
        run: |
          timeout --signal=TERM --kill-after=2s 15s python - <<'PY'
          import json
          import os
          import psycopg

          try:
              with psycopg.connect(
                  os.environ["DATABASE_URL"],
                  connect_timeout=5,
                  options="-c default_transaction_read_only=on -c statement_timeout=5000",
              ) as connection:
                  with connection.cursor() as cursor:
                      cursor.execute("SHOW server_version_num")
                      actual = cursor.fetchone()[0]
          except psycopg.Error:
              raise SystemExit("Pinned PostgreSQL read-only version probe failed") from None
          if actual != "170012":
              raise SystemExit("Pinned PostgreSQL server version mismatch")
          print(json.dumps({"schema": "pamolive.ci-postgres-version/1", "server_version_num": 170012, "read_only_probe": True}))
          PY
      - name: Verify the source-only Vault reservation boundaries without network or SQL
        run: python -I -B qualification/vault_reservation/run_pure.py
      - name: Reject altered or overbroad Vault reservation wheel payloads as data
        run: python -I -B qualification/vault_reservation/test_wheel.py
      - name: Verify the 62 source-only usage-anchor tests without network or SQL
        run: timeout --signal=TERM --kill-after=2s 60s python -I -B components/usage-anchor/tests/run_pure.py
      - run: ruff check .
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - name: Verify directory protocols and persistent tenant-scoped inventory
        env:
          PAMOLIVE_TEST_DATABASE_NAME: test_pamolive_directory
        run: |
          set -o pipefail
          python -c "import resource; print('Runner RLIMIT_NOFILE:', resource.getrlimit(resource.RLIMIT_NOFILE)); print('LDAP peer child cap: 256; parent unchanged')"
          python -c "from tests.fixtures.ldap_directory import available; assert available(), 'Native LDAP gate must run, not skip'"
          python manage.py test tests.test_directory_adapters tests.test_directory_ldap_wire tests.test_directory_peer_limits tests.test_directory_inventory tests.test_directory_inventory_concurrency tests.test_directory_redteam tests.test_directory_views tests.test_directory_views_redteam tests.test_directory_restore --noinput 2>&1 | tee "$RUNNER_TEMP/pamolive-directory-tests.log"
      - name: Verify P1 contracts, Identity, Governance, Observe and module isolation
        run: >-
          python manage.py test tests.test_access_contract tests.test_p1_module_isolation
          tests.test_access_contract_views tests.test_access_contract_concurrency
          tests.test_identity360 tests.test_identity360_concurrency tests.test_mover_authority
          tests.test_governance_workspace tests.test_governance_workspace_concurrency
          tests.test_governance_exception_restore tests.test_module_activation_authority
          tests.test_observe_story tests.test_observe_concurrency tests.test_synology_preparation
          tests.test_jobs_database_recovery tests.test_jobs_security_recovery
          tests.test_restore_diagnostics tests.test_restore tests.test_restore_session_drain
          --noinput
      - name: Verify real P0 trust ceremonies in the synthetic HA fixture
        env:
          PAMOLIVE_TEST_DATABASE_NAME: test_pamolive_ha_trust
        run: python manage.py test tests.test_active_active tests.test_active_active_trust --noinput
      - name: Verify the complete offline restore corpus with tenant-scoped provenance
        env:
          PAMOLIVE_TEST_DATABASE_NAME: test_pamolive_restore_source
        run: python manage.py test tests.test_restore_full_corpus --noinput
      - name: Run all local contracts, isolation and P0 regressions on PostgreSQL
        shell: bash
        run: |
          set -o pipefail
          python manage.py test --noinput --verbosity 2 2>&1 | tee "$RUNNER_TEMP/pamolive-postgres-tests.log"
      - name: Retain PostgreSQL and directory results, including failures and skips
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: pamolive-postgres-tests-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/pamolive-postgres-tests.log
            ${{ runner.temp }}/pamolive-directory-tests.log
          if-no-files-found: warn
          retention-days: 7
      - name: Verify real HTTPS OIDC round-trip, local MFA and tenant boundaries
        run: python manage.py test tests.test_oidc tests.test_oidc_tls --noinput
      - name: Verify a separately installed signed module on PostgreSQL
        run: python -m deploy.check_extensions --postgres
      - name: Verify the signed V3 periodic signals with a separately installed wheel
        run: python -m deploy.check_extensions --postgres --periodic
      - name: Prepare the committed Docker context without local or generated files
        run: >-
          python -m deploy.build_context --revision "$GITHUB_SHA"
          --destination "$RUNNER_TEMP/pamolive-committed-context"
          --output "$RUNNER_TEMP/pamolive-committed-context.json"
      - name: Build production image and verify local credential exclusion
        run: |
          cd "$RUNNER_TEMP/pamolive-committed-context"
          printf 'must-not-enter-the-image' > .bootstrap-admin
          cp .bootstrap-admin .image-private-check.dump
          mkdir .image-private-context config/.nas-access
          cp .bootstrap-admin .image-private-context/undesignated.txt
          cp .bootstrap-admin config/.nas-access/key-without-extension
          cp .bootstrap-admin config/qualification.pem
          cp .bootstrap-admin tests/.env.qualification
          cp .bootstrap-admin tests/qualification.tar
          docker build --target production --provenance=false --sbom=false \
            --label "org.opencontainers.image.source=https://github.com/pamolive/PamOlive-Platform" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "io.pamolive.source.license=AGPL-3.0-or-later" \
            -t pamolive-platform:ci .
          docker run --rm -i --network none --entrypoint python pamolive-platform:ci - <<'PY'
          from importlib.util import find_spec
          from pathlib import Path

          root = Path("/app")
          paths = (
              ".bootstrap-admin", ".env", ".image-private-check.dump",
              ".image-private-context", "config/.nas-access", "config/qualification.pem",
              "tests/.env.qualification", "tests/qualification.tar",
          )
          assert not any((root / name).exists() for name in paths)
          assert (root / ".env.example").is_file()
          assert not Path("/opt/pamolive-test").exists()
          assert find_spec("PIL") is None
          PY
      - name: Verify native SSH/RDP plugins without contacting a target
        run: docker run --rm --user 1000:1000 --network none --cap-drop ALL --security-opt no-new-privileges --read-only --tmpfs /tmp:size=64m,mode=1777 --entrypoint python pamolive-platform:ci -m deploy.check_guacd
      - name: Prepare a separately signed extension wheel
        run: python -m deploy.prepare_extension_fixture /tmp/pamolive-extension-image-context
      - name: Build and verify the single-container extension image
        run: |
          docker build --build-arg PAMOLIVE_BASE_IMAGE=pamolive-platform:ci -t pamolive-platform:extension-ci /tmp/pamolive-extension-image-context
          docker run --rm --network none --entrypoint python pamolive-platform:extension-ci -c "from pathlib import Path; from importlib.util import find_spec; assert not Path('/app/.env').exists(); assert not Path('/app/publisher-private.pem').exists(); assert not Path('/opt/pamolive-test').exists(); assert find_spec('PIL') is None; assert not Path('/app/db.sqlite3').exists()"
      - name: Verify installed extension routes, permissions and isolation in the built image
        run: docker run --rm --user 1000:1000 --network host --cap-drop ALL --security-opt no-new-privileges --read-only --tmpfs /tmp:size=64m,mode=1777 -e DATABASE_URL -e SECRET_KEY -e PAMOLIVE_TEST_DATABASE_NAME=test_pamolive_extensions -e PAMOLIVE_REQUIRE_EXTENSION_ASSETS=1 --entrypoint python pamolive-platform:extension-ci manage.py test tests.test_extensions_runtime --keepdb --noinput
      - name: Verify native SSH pinning and keyboard round-trip on a disposable fixture
        run: docker run --rm --user 1000:1000 --network none --cap-drop ALL --security-opt no-new-privileges --read-only --tmpfs /tmp:size=64m,mode=1777 --entrypoint python pamolive-platform:ci -m deploy.check_native_ssh
      - name: Build test-only headless RDP peer
        run: docker build --target native-test -t pamolive-platform:native-test "$RUNNER_TEMP/pamolive-committed-context"
      - name: Verify native RDP NLA, certificate pin and keyboard round-trip
        run: docker run --rm --user 1000:1000 --network none --dns 127.0.0.1 --cap-drop ALL --security-opt no-new-privileges --read-only --tmpfs /tmp:size=64m,mode=1777 --entrypoint python pamolive-platform:native-test -m deploy.check_native_rdp
      - name: Verify synthetic NLA behavior under negative and silent loopback DNS
        run: docker run --rm --user 1000:1000 --network none --dns 127.0.0.1 --cap-drop ALL --security-opt no-new-privileges --read-only --tmpfs /tmp:size=64m,mode=1777 --entrypoint python pamolive-platform:native-test -m deploy.check_native_dns
      - name: Verify real WebSocket SSH transport and recording on PostgreSQL
        run: docker run --rm --user 1000:1000 --network host --cap-drop ALL --security-opt no-new-privileges --read-only --tmpfs /tmp:size=64m,mode=1777 -e DATABASE_URL -e SECRET_KEY -e PAM_REQUIRE_NATIVE=1 --entrypoint python pamolive-platform:ci manage.py test tests.test_pam_relay_e2e --noinput
      - name: Verify real WebSocket RDP NLA, revocation, capture and redirection defense
        run: docker run --rm --user 1000:1000 --network host --dns 127.0.0.1 --cap-drop ALL --security-opt no-new-privileges --read-only --tmpfs /tmp:size=64m,mode=1777 -e DATABASE_URL -e SECRET_KEY -e PAM_REQUIRE_NATIVE=1 -e PAM_REQUIRE_RDP=1 --entrypoint python pamolive-platform:native-test manage.py test tests.test_pam_rdp_e2e --noinput
      - name: Verify single-container runtime privilege separation
        run: |
          docker run --rm --network host -e DATABASE_URL -e SECRET_KEY --entrypoint python pamolive-platform:ci manage.py migrate --noinput
          docker run -d --name pamolive-platform-runtime-ci --init --network host --cap-drop ALL --cap-add SETUID --cap-add SETGID --cap-add KILL --security-opt no-new-privileges --read-only --tmpfs /tmp:size=64m,mode=1777 -e DATABASE_URL -e SECRET_KEY pamolive-platform:ci
          trap 'docker logs pamolive-platform-runtime-ci; docker rm -f pamolive-platform-runtime-ci' EXIT
          for attempt in $(seq 1 30); do
            if docker exec pamolive-platform-runtime-ci python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/',timeout=1)"; then break; fi
            sleep 1
          done
          docker exec pamolive-platform-runtime-ci python -m deploy.check_runtime
      - name: Verify two active nodes, HTTP and PAM failover and a database partition
        run: |
          python -c "import os, psycopg; connection=psycopg.connect(os.environ['DATABASE_URL'], autocommit=True); connection.execute('CREATE DATABASE test_pamolive_ha OWNER pamolive'); connection.close()"
          ha_network=$(docker inspect '${{ job.services.postgres.id }}' --format '{{json .NetworkSettings.Networks}}' | python -c "import json,sys; print(next(iter(json.load(sys.stdin))))")
          python -m deploy.prepare_active_active_environment /tmp/pamolive-ha-ci.env --image pamolive-platform:ci --network "$ha_network" --host postgres
          python -m deploy.check_active_active --env-file /tmp/pamolive-ha-ci.env --native-pam --native-rdp --database-partition
      - name: Restore a populated archive with restricted credentials and intact proofs
        run: |
          mkdir -m 700 -- "$RUNNER_TEMP/pamolive-restore-public"
          python -m deploy.check_restore_ci --postgres-container '${{ job.services.postgres.id }}' --ha-env-file /tmp/pamolive-ha-ci.env --public-report "$RUNNER_TEMP/pamolive-restore-public/restore-qualification.json"
      - name: Verify controlled historical upgrade, rollback and exact old-column preservation
        run: python -m deploy.check_upgrade_ci --postgres-container '${{ job.services.postgres.id }}' --ha-env-file /tmp/pamolive-ha-ci.env
      - name: Verify the image-only Compose runtime is identical
        run: |
          export ENV_FILE="$RUNNER_TEMP/compose-qualification.env"
          : > "$ENV_FILE"
          export DATABASE_URL=postgresql://fixture:fixture@db.example.test/pamolive
          export SECRET_KEY=compose-qualification-only
          export PAMOLIVE_IMAGE=ghcr.io/pamolive/pamolive-platform@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          docker compose --env-file "$ENV_FILE" -f compose.yml config --format json > "$RUNNER_TEMP/compose-source.json"
          docker compose --env-file "$ENV_FILE" -f compose.registry.yml config --format json > "$RUNNER_TEMP/compose-registry.json"
          python -m deploy.qualified_image compare-compose "$RUNNER_TEMP/compose-source.json" "$RUNNER_TEMP/compose-registry.json" --image "$PAMOLIVE_IMAGE"
      - name: Export and verify the exact qualified image
        run: |
          python -m deploy.qualified_image export "$RUNNER_TEMP/pamolive-qualified-image" --revision "$GITHUB_SHA"
          python -m deploy.qualified_image verify "$RUNNER_TEMP/pamolive-qualified-image" --revision "$GITHUB_SHA"
          docker image load --input "$RUNNER_TEMP/pamolive-qualified-image/pamolive-linux-amd64.tar"
          python -m deploy.qualified_image verify "$RUNNER_TEMP/pamolive-qualified-image" --revision "$GITHUB_SHA" --loaded
      - name: Verify installed native binaries and bind the combined SBOM to the tested image
        shell: bash
        run: |
          set -euo pipefail
          proof="$RUNNER_TEMP/pamolive-image-security"
          mkdir -m 700 "$proof"
          image_ref=$(docker image inspect pamolive-platform:ci --format '{{.Id}}')
          config_id=$(python -c 'import json,os; from pathlib import Path; print(json.loads((Path(os.environ["RUNNER_TEMP"])/"pamolive-qualified-image/qualified-image.json").read_text())["image_id"])')
          docker run --rm --user "$(id -u):$(id -g)" --network none --cap-drop ALL --security-opt no-new-privileges --read-only --tmpfs /tmp:size=32m,mode=1777 --entrypoint python "$image_ref" -c 'from pathlib import Path; import sys; sys.stdout.buffer.write(Path("/opt/pamolive-native-manifest.json").read_bytes())' > "$proof/native-manifest.json"
          docker run --rm --user "$(id -u):$(id -g)" --network none --cap-drop ALL --security-opt no-new-privileges --read-only --tmpfs /tmp:size=32m,mode=1777 --mount "type=bind,src=$proof,dst=/proof" --entrypoint python "$image_ref" -m deploy.native_inventory --output /proof/native-report.json
          docker run --rm --user "$(id -u):$(id -g)" --network none --cap-drop ALL --security-opt no-new-privileges --read-only --tmpfs /tmp:size=32m,mode=1777 --mount "type=bind,src=$proof,dst=/proof" --entrypoint python "$image_ref" -m deploy.check_database_driver --output /proof/database-driver.json
          docker run --rm --user "$(id -u):$(id -g)" --network none --cap-drop ALL --security-opt no-new-privileges --read-only --tmpfs /tmp:size=32m,mode=1777 --mount "type=bind,src=$proof,dst=/proof" --entrypoint python "$image_ref" -m deploy.krb5_inventory --verify --output /proof/krb5-report.json
          docker run --rm -i --user "$(id -u):$(id -g)" --network none --cap-drop ALL --security-opt no-new-privileges --read-only --tmpfs /tmp:size=32m,mode=1777 --mount "type=bind,src=$proof,dst=/proof" --entrypoint python "$image_ref" - <<'PY'
          import os
          from pathlib import Path
          from deploy import krb5_inventory as gate

          os.umask(0o077)
          manifest = gate.inventory()
          root = Path("/")
          raw = gate.read_file(root, gate.MANIFEST_PATH, 2 * 1024**2)
          assert gate.read_json(Path(gate.MANIFEST_PATH)) == manifest
          target = Path("/proof/krb5-evidence")
          target.mkdir(mode=0o700)
          with Path("/proof/krb5-manifest.json").open("xb") as output:
              output.write(raw)
          names = {"inventory.json", "provenance.json", *manifest["provenance"]["evidence"]}
          for name in sorted(names):
              gate.evidence_name(name)
              data = gate.read_file(root, gate.PREFIX + "/" + name, 32 * 1024**2)
              with (target / name).open("xb") as output:
                  output.write(data)
          PY
          python -m deploy.krb5_sbom --manifest "$proof/krb5-manifest.json" --report "$proof/krb5-report.json" --image-digest-kind image_config --image-digest "$config_id" --output "$proof/krb5-backport.cdx.json"
          python -m pip_audit --strict --no-deps --disable-pip -r requirements.lock -f cyclonedx-json -o "$proof/application.cdx.json"
          # Same qualified archive/image; Expat evidence never suppresses the existing scans.
          python -m deploy.expat_image --archive "$RUNNER_TEMP/pamolive-qualified-image/pamolive-linux-amd64.tar" --image-id "$config_id" --output "$proof/expat-image.json"
          timeout --signal=TERM --kill-after=15s 120s docker run --rm --pull never --no-healthcheck --user "$(id -u):$(id -g)" --network none --cpus 1 --memory 512m --memory-swap 512m --pids-limit 64 --cap-drop ALL --security-opt no-new-privileges --read-only --tmpfs /tmp:size=32m,mode=1777 --mount "type=bind,src=$proof,dst=/proof" --entrypoint python "$image_ref" -I -B -S /usr/local/libexec/pamolive-expat4/verify_runtime.py /proof/expat-runtime
          python -m deploy.native_sbom --app-sbom "$proof/application.cdx.json" --native-manifest "$proof/native-manifest.json" --native-report "$proof/native-report.json" --expat-report "$proof/expat-image.json" --image-digest-kind image_config --image-digest "$config_id" --output "$proof/combined.cdx.json"
      - name: Exercise Jansson differential and receive exact-image absence DATA
        timeout-minutes: 15
        shell: bash
        run: |
          set -euo pipefail
          context="$RUNNER_TEMP/pamolive-committed-context"
          oracles="$RUNNER_TEMP/pamolive-jansson-reference-data"
          proof="$RUNNER_TEMP/pamolive-image-security"
          test ! -e "$oracles"
          timeout --signal=TERM --kill-after=15s 540s docker build \
            --target json-reference-data --provenance=false --sbom=false \
            --output "type=local,dest=$oracles" "$context"
          timeout --signal=TERM --kill-after=15s 240s python -m deploy.jansson_ci_evidence \
            --context "$context" --context-receipt "$RUNNER_TEMP/pamolive-committed-context.json" \
            --bundle "$RUNNER_TEMP/pamolive-qualified-image" --oracles "$oracles" \
            --output "$proof/jansson" --revision "$GITHUB_SHA"
      - name: Verify a fresh Compose installation of the loaded image without building
        run: |
          export PAMOLIVE_TEST_DATABASE_NETWORK
          PAMOLIVE_TEST_DATABASE_NETWORK=$(docker inspect '${{ job.services.postgres.id }}' --format '{{json .NetworkSettings.Networks}}' | python -c "import json,sys; print(next(iter(json.load(sys.stdin))))")
          bash deploy/check_registry_install_ci.sh
      - name: Scan the exact image, qualify native matching and enforce individually reviewed findings
        run: bash deploy/check_image_scan_ci.sh
      # Insert AFTER the final image scan, BEFORE existing artifact upload/cleanup.
      - name: Observe only public postgres passwd UID and GID in one confined container
        if: always()
        timeout-minutes: 4
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          source="$GITHUB_WORKSPACE/qualification/public_pg_identity_probe"
          printf '%s  %s\n' 127868b6c9cfba30058de7469240ac4ffa51ac57591586779c9fbb9b02b4256f "$source/owner.py" | sha256sum --check --status
          work="$RUNNER_TEMP/pamolive-pg-identity-${{ github.run_id }}-${{ github.run_attempt }}"
          test ! -e "$work"
          env -i PATH=/usr/bin:/bin LANG=C LC_ALL=C \
            GITHUB_ACTIONS=true CI=true RUNNER_ENVIRONMENT=github-hosted \
            RUNNER_TEMP="$RUNNER_TEMP" GITHUB_RUN_ID='${{ github.run_id }}' \
            GITHUB_RUN_ATTEMPT='${{ github.run_attempt }}' \
            /usr/bin/python3 -I -S -B "$source/owner.py" run \
            --assets-sha faaed14a1015f2cf3fba7959ffcf48f50d4a29d4f1089236d73fb5719e63eb9d --work "$work"
      - name: Retain only the closed public PG identity DATA report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: public-pg-identity-data-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pamolive-pg-identity-${{ github.run_id }}-${{ github.run_attempt }}/public-report.json
          if-no-files-found: warn
          retention-days: 7
      - name: Observe public Docker and image metadata without changing the Engine
        if: always()
        timeout-minutes: 4
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          source="$GITHUB_WORKSPACE/qualification/public_engine_measurement"
          printf '%s  %s\n' 98a8c2438f969468b949a6529a8ff526dc377f853b1cbd41c53692ab746533d8 "$source/collector.py" | sha256sum --check --status
          work="$RUNNER_TEMP/public-engine-${{ github.run_id }}-${{ github.run_attempt }}"
          test ! -e "$work"
          env -i PATH=/usr/bin:/bin LANG=C LC_ALL=C \
            /usr/bin/python3 -I -S -B "$source/collector.py" --work "$work" --github-hosted-disposable-public-read
      - name: Retain only public Engine DATA
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: public-engine-data-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/public-engine-${{ github.run_id }}-${{ github.run_attempt }}/public-report.json
            ${{ runner.temp }}/public-engine-${{ github.run_id }}-${{ github.run_attempt }}/root-read-intent.json
            ${{ runner.temp }}/public-engine-${{ github.run_id }}-${{ github.run_attempt }}/root-read-pid.json
            ${{ runner.temp }}/public-engine-${{ github.run_id }}-${{ github.run_attempt }}/root-read-result.json
          if-no-files-found: warn
          retention-days: 7
      - name: Retain image identity and full security evidence even when promotion is blocked
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: pamolive-image-security-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/pamolive-image-security/
            ${{ runner.temp }}/pamolive-restore-public/restore-qualification.json
            ${{ runner.temp }}/pamolive-qualified-image/qualified-image.json
            ${{ runner.temp }}/pamolive-committed-context.json
            ${{ runner.temp }}/pamolive-jansson-reference-data/json-reference.jsonl
            ${{ runner.temp }}/pamolive-jansson-reference-data/winpr-jansson-build.json
            ${{ runner.temp }}/pamolive-jansson-reference-data/winpr-jansson-runtime.json
            ${{ runner.temp }}/pamolive-jansson-reference-data/build-identity.json
            ${{ runner.temp }}/pamolive-jansson-reference-data/runtime-identity.json
            ${{ runner.temp }}/pamolive-jansson-reference-data/reference-identity.json
          if-no-files-found: warn
          retention-days: 7
      - name: Retain the qualified image for main publication
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'pamolive/PamOlive-Platform'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: pamolive-linux-amd64-${{ github.sha }}
          path: ${{ runner.temp }}/pamolive-qualified-image/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - name: Remove the empty private LDAP fixture and restore its parent ACL
        if: always() && steps.ldap_fixture.outputs.acl_saved == 'true'
        run: |
          set -euo pipefail
          restore_parent_acl() {
            sudo setfacl --restore="$RUNNER_TEMP/pamolive-ldap-parent.acl"
            sudo getfacl -p /var/lib/ldap | cmp - "$RUNNER_TEMP/pamolive-ldap-parent.acl"
          }
          trap restore_parent_acl EXIT
          [[ "$PAMOLIVE_LDAP_FIXTURE_PARENT" =~ ^/var/lib/ldap/pamolive-fixtures-[1-9][0-9]{0,19}-[1-9][0-9]{0,3}$ ]]
          if test '${{ steps.ldap_fixture.outputs.created }}' = true && test -d "$PAMOLIVE_LDAP_FIXTURE_PARENT"; then
            test ! -L "$PAMOLIVE_LDAP_FIXTURE_PARENT"
            test "$(stat -c %u "$PAMOLIVE_LDAP_FIXTURE_PARENT")" = "$(id -u)"
            # The runner intentionally has no write permission on the stock
            # parent. Root removes only this exact, verified empty child.
            sudo rmdir -- "$PAMOLIVE_LDAP_FIXTURE_PARENT"
          fi

  p2-installed-libraries:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12.16'
          architecture: x64
      - name: Prepare the isolated installed-library controller
        shell: bash
        run: |
          set -euo pipefail
          # BEGIN_P2_INSTALLED_CONTROLLER
          cat > "$RUNNER_TEMP/pamolive-p2-installed.py" <<'PY'
          """Linux CPython3.12 wheel-only P2 library check; no service or authority."""
          import argparse
          import hashlib
          import importlib.util
          import json
          import os
          import platform
          import re
          import shutil
          import stat
          import subprocess
          import sys
          import sysconfig
          import time
          import zipfile
          from pathlib import Path

          NAMES = {"pip", "setuptools", "wheel", "packaging", "cryptography", "cffi", "pycparser"}
          TEST_NAMES = {"cryptography", "cffi", "pycparser"}


          def require(value, code):
              if not value:
                  raise ValueError(code)


          def sha(path):
              with path.open("rb") as stream:
                  return hashlib.file_digest(stream, "sha256").hexdigest()


          def target():
              require(sys.implementation.name == "cpython" and sys.version_info[:3] == (3, 12, 16), "cpython_profile")
              require(sys.platform == "linux" and platform.machine() == "x86_64", "linux_amd64_only")
              require(sysconfig.get_config_var("SOABI") == "cpython-312-x86_64-linux-gnu", "cp312_abi")
              require(not sysconfig.get_config_var("Py_DEBUG") and not sysconfig.get_config_var("Py_GIL_DISABLED"), "regular_abi")
              libc, version = platform.libc_ver()
              require(libc == "glibc" and re.fullmatch(r"2\.[0-9]{2}", version) and int(version.split(".")[1]) >= 34, "manylinux_minimum")
              require(os.geteuid() != 0, "nonroot_check_required")


          def inputs(source):
              spec = importlib.util.spec_from_file_location("p2_materials_gate", source / "deploy/python_materials.py")
              gate = importlib.util.module_from_spec(spec)
              spec.loader.exec_module(gate)
              manifest, manifest_sha = gate.load_manifest(source / "deploy/python-materials.linux-amd64.json")
              gate.check_locks(manifest, source)
              rows = {row["name"]: row for row in manifest["materials"] if row["name"] in NAMES}
              require(set(rows) == NAMES and all(row["kind"] == "wheel" for row in rows.values()), "seven_public_wheels")
              lock = b"\n".join(line for line in (source / "requirements-p2-test-linux.lock").read_bytes().splitlines() if line and not line.startswith(b"#")) + b"\n"
              require(lock == gate.lock_bytes([rows[name] for name in TEST_NAMES]), "minimal_test_lock")
              return gate, rows, manifest_sha


          def acquire(source, directory):
              gate, rows, manifest_sha = inputs(source)
              directory.mkdir(mode=0o700)
              opener = gate.https_opener()
              started = time.monotonic()
              for row in rows.values():
                  require(time.monotonic() - started < 1800, "acquisition_budget")
                  gate.download(row, directory, opener)
                  data = gate.verify_file(directory / row["filename"], row)
                  if row["name"] != "setuptools":
                      gate.inspect_upstream(directory / row["filename"], verified_bytes=data)
              (directory / "acquisition.json").write_text(json.dumps({"manifest_sha256": manifest_sha, "files": {row["filename"]: row["sha256"] for row in rows.values()}, "public_only": True}, sort_keys=True) + "\n")
              print(json.dumps({"phase": "public_acquisition", "wheels": len(rows), "manifest_sha256": manifest_sha}), flush=True)


          def copy_tree(source, destination):
              total = 0
              for path in source.rglob("*"):
                  require(not path.is_symlink(), "source_link")
                  if path.is_file():
                      total += path.stat().st_size
                      require(path.stat().st_size <= 2 * 1024**2 and total <= 8 * 1024**2, "source_budget")
              shutil.copytree(source, destination, ignore=shutil.ignore_patterns("__pycache__", "*.pyc", ".pytest_cache", "*.egg-info", "build", "dist"))


          def run(source, directory, work, report):
              gate, rows, manifest_sha = inputs(source)
              work.mkdir(mode=0o700)
              wheels = work / "public-wheels"
              wheels.mkdir(mode=0o700)
              for row in rows.values():
                  data = gate.verify_file(directory / row["filename"], row)
                  if row["name"] != "setuptools":
                      gate.inspect_upstream(directory / row["filename"], verified_bytes=data)
                  with (wheels / row["filename"]).open("xb") as stream:
                      stream.write(data)
              home = work / "home"
              home.mkdir()
              temporary = work / "tmp"
              temporary.mkdir()
              minimal_env = {"PATH": "/usr/local/bin:/usr/bin:/bin", "HOME": str(home), "LANG": "C.UTF-8", "LC_ALL": "C.UTF-8", "TMPDIR": str(temporary), "PYTHONDONTWRITEBYTECODE": "1", "PIP_CONFIG_FILE": "/dev/null", "PIP_DISABLE_PIP_VERSION_CHECK": "1", "PIP_NO_INDEX": "1"}

              def call(command, *, cwd=work, capture=False):
                  command_env = {**minimal_env, "PATH": str(Path(command[0]).parent) + ":/usr/bin:/bin"}
                  result = subprocess.run(command, cwd=cwd, env=command_env, check=True, timeout=120, text=True, stdout=subprocess.PIPE if capture else None)
                  return result.stdout.strip() if capture else None

              def pip(python, *arguments):
                  call([str(python), "-I", "-B", "-m", "pip", *arguments])

              def install(python, lock, links):
                  pip(python, "install", "--no-index", "--no-deps", "--only-binary=:all:", "--require-hashes", "--no-compile", "--no-cache-dir", "--find-links", str(links), "-r", str(lock))

              interpreters = {}
              bootstrap = wheels / rows["pip"]["filename"]
              pip_args = ["install", "--ignore-installed", "--no-index", "--no-deps", "--only-binary=:all:", "--require-hashes", "--no-compile", "--no-cache-dir", "--find-links", str(wheels), "-r", str(source / "requirements-bootstrap.lock")]
              bootstrap_code = "import runpy,sys; sys.path.insert(0,sys.argv.pop(1)); sys.argv[0]='pip'; runpy.run_module('pip',run_name='__main__')"
              for name in ("build", "envelope", "contracts"):
                  location = work / ("venv-" + name)
                  call([sys.executable, "-I", "-B", "-m", "venv", "--without-pip", str(location)])
                  python = location / "bin/python"
                  empty = "import importlib.util; assert importlib.util.find_spec('pip') is None"
                  call([str(python), "-I", "-B", "-c", empty])
                  call([str(python), "-I", "-B", "-c", bootstrap_code, str(bootstrap), *pip_args])
                  interpreters[name] = python
              install(interpreters["build"], source / "requirements-python-build-tools-linux.lock", wheels)
              install(interpreters["envelope"], source / "requirements-p2-test-linux.lock", wheels)
              packages = (("envelope", "vault", "pamolive-vault-envelope", "pamolive_vault_envelope", 25), ("contracts", "vault-registry", "pamolive-vault-contracts", "pamolive_vault_contracts", 17))
              built = {}
              for name, component, distribution, module, count in packages:
                  build_source = work / ("build-source-" + name)
                  copy_tree(source / "components" / component, build_source)
                  output = work / ("built-" + name)
                  output.mkdir()
                  pip(interpreters["build"], "wheel", "--no-index", "--no-build-isolation", "--no-deps", "--no-cache-dir", "--wheel-dir", str(output), str(build_source))
                  paths = list(output.iterdir())
                  require(len(paths) == 1 and paths[0].name == module + "-0.1.0a1-py3-none-any.whl", "pure_local_wheel")
                  wheel = paths[0]
                  with zipfile.ZipFile(wheel) as archive:
                      names = archive.namelist()
                      require(len(names) <= 256 and len(set(names)) == len(names), "wheel_members")
                      total = 0
                      for entry in archive.infolist():
                          require(not entry.filename.startswith("/") and ".." not in entry.filename.split("/") and "\\" not in entry.filename, "wheel_path")
                          require(stat.S_IFMT(entry.external_attr >> 16) in (0, stat.S_IFREG, stat.S_IFDIR), "wheel_type")
                          require(not entry.filename.endswith((".pth", ".pyc", ".so", ".pyd", ".dll")), "pure_python_only")
                          total += entry.file_size
                          require(entry.file_size <= 1024**2 and total <= 2 * 1024**2, "wheel_budget")
                      metadata = archive.read(module + "-0.1.0a1.dist-info/WHEEL").decode()
                      require("Root-Is-Purelib: true" in metadata and "Tag: py3-none-any" in metadata, "pure_wheel_metadata")
                  lock = work / (name + "-current-build.lock")
                  lock.write_text(distribution + "==0.1.0a1 --hash=sha256:" + sha(wheel) + "\n")
                  install(interpreters[name], lock, output)
                  built[name] = {"filename": wheel.name, "sha256": sha(wheel), "size": wheel.stat().st_size}
              expected = {"build": {"pip": rows["pip"]["version"], **{name: rows[name]["version"] for name in ("setuptools", "wheel", "packaging")}}, "envelope": {"pip": rows["pip"]["version"], "pamolive-vault-envelope": "0.1.0a1", **{name: rows[name]["version"] for name in TEST_NAMES}}, "contracts": {"pip": rows["pip"]["version"], "pamolive-vault-contracts": "0.1.0a1"}}
              source_files = {path.relative_to(source).as_posix(): sha(path) for path in (source / "components").rglob("*") if path.is_file() and "__pycache__" not in path.parts and not path.name.endswith(".pyc")}
              source_files.update({name: sha(source / name) for name in ("deploy/python_materials.py", "deploy/python-materials.linux-amd64.json", "requirements-bootstrap.lock", "requirements-python-build-tools-linux.lock", "requirements-p2-test-linux.lock")})
              revision = os.environ.get("GITHUB_SHA")
              require(revision is None or re.fullmatch(r"[0-9a-f]{40}", revision), "source_revision")
              proof = {"schema": "pamolive.p2-installed-libraries.v1", "ci_source_revision": revision, "controller_sha256": sha(Path(__file__)), "source_files_sha256": source_files, "manifest_sha256": manifest_sha, "public_wheels": {row["filename"]: row["sha256"] for row in rows.values()}, "built_wheels": built, "venvs": {}, "tests": {}, "build_verified": False, "attestation_verified": False, "authority_created": False}
              probe = """import importlib.metadata as m,importlib.util,json,re,site,sys,sysconfig
          from pathlib import Path
          norm=lambda n:re.sub('[-_.]+','-',n).lower()
          items=list(m.distributions()); actual={norm(d.metadata['Name']):d.version for d in items}
          assert len(items)==len(actual) and actual==EXPECTED
          assert sys.prefix!=sys.base_prefix and not site.ENABLE_USER_SITE
          assert 'include-system-site-packages = false' in (Path(sys.prefix)/'pyvenv.cfg').read_text().lower()
          for name in ('django','platform_core','platform_modules','config','boto3','botocore','requests','psycopg','ldap'):
           assert importlib.util.find_spec(name) is None, name
          for name in ('pip',MODULE):
           if name:
            found=importlib.util.find_spec(name); assert found and Path(found.origin).resolve().is_relative_to(Path(sys.prefix).resolve())
          print(json.dumps({'distributions':actual,'prefix_isolated':True,'global_site_fallback':False,'application_or_sdk_importable':False}))
          """
              for name, python in interpreters.items():
                  module = {"build": "", "envelope": "pamolive_vault_envelope", "contracts": "pamolive_vault_contracts"}[name]
                  text = probe.replace("EXPECTED", repr(expected[name])).replace("MODULE", repr(module))
                  proof["venvs"][name] = json.loads(call([str(python), "-I", "-B", "-c", text], capture=True))
                  pip(python, "check")
              for name, component, distribution, module, count in packages:
                  tests = work / "tests" / name / "tests"
                  tests.parent.mkdir(parents=True)
                  copy_tree(source / "components" / component / "tests", tests)
                  require(not (tests.parent / "src").exists(), "no_source_fallback")
                  code = "import pathlib,sys,unittest; import " + module + " as package; assert pathlib.Path(package.__file__).resolve().is_relative_to(pathlib.Path(sys.prefix).resolve()); suite=unittest.defaultTestLoader.discover(" + repr(str(tests)) + "); result=unittest.TextTestRunner(verbosity=2).run(suite); assert result.testsRun==" + str(count) + "; assert not result.skipped; raise SystemExit(not result.wasSuccessful())"
                  call([str(interpreters[name]), "-I", "-B", "-c", code], cwd=tests.parent)
                  proof["tests"][name] = {"executed": count, "skipped": 0, "installed_package": True, "tests_copied_without_modification": True}
              require(all(sha(wheels / row["filename"]) == row["sha256"] for row in rows.values()), "material_changed")
              with report.open("x", encoding="utf8") as stream:
                  json.dump(proof, stream, indent=2, sort_keys=True)
              print(json.dumps({"phase": "installed_library_tests", "envelope": 25, "contracts": 17, "report": str(report), "authority_created": False}), flush=True)


          def main():
              parser = argparse.ArgumentParser(description=__doc__)
              parser.add_argument("operation", choices=("acquire", "run"))
              parser.add_argument("--source", type=Path, required=True)
              parser.add_argument("--inputs", type=Path, required=True)
              parser.add_argument("--work", type=Path)
              parser.add_argument("--report", type=Path)
              args = parser.parse_args()
              target()
              source = args.source.resolve(strict=True)
              if args.operation == "acquire":
                  acquire(source, args.inputs)
              else:
                  require(args.work is not None and args.report is not None, "run_paths")
                  run(source, args.inputs.resolve(strict=True), args.work, args.report)


          if __name__ == "__main__":
              main()
          PY
          # END_P2_INSTALLED_CONTROLLER
      - name: Acquire only seven reviewed public wheels with size and SHA verification
        shell: bash
        run: |
          set -euo pipefail
          python -I -B "$RUNNER_TEMP/pamolive-p2-installed.py" acquire --source "$GITHUB_WORKSPACE" --inputs "$RUNNER_TEMP/pamolive-p2-inputs"
      - name: Build pure wheels and test the installed packages in three separate venvs
        shell: bash
        run: |
          set -euo pipefail
          python -I -B "$RUNNER_TEMP/pamolive-p2-installed.py" run --source "$GITHUB_WORKSPACE" --inputs "$RUNNER_TEMP/pamolive-p2-inputs" --work "$RUNNER_TEMP/pamolive-p2-work" --report "$RUNNER_TEMP/pamolive-p2-work/report.json"
      - name: Retain installed-library evidence without an authority claim
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: pamolive-p2-installed-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pamolive-p2-work/report.json
          if-no-files-found: warn
          retention-days: 7
# Insert this job under jobs: in existing ci.yml. No separate/unregistered workflow.
  p1g-headless:
    if: >-
      github.repository == 'pamolive/PamOlive-Platform' &&
      ((github.event_name == 'push' && github.ref == 'refs/heads/agent/p1-g-headless') ||
       (github.event_name == 'pull_request' && github.head_ref == 'agent/p1-g-headless' &&
        github.event.pull_request.head.repo.full_name == github.repository))
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
    services:
      postgres:
        image: docker.io/library/postgres@sha256:6f7593c161689b6b02c78668b314af7da8811b592c5519108c57a49d0b6ad788
        env:
          POSTGRES_USER: p1g
          POSTGRES_PASSWORD: p1g-synthetic-disposable-only
          POSTGRES_DB: pamolive_p1g
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U p1g -d pamolive_p1g"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12.16'
      - name: Capture only the committed public source used by this lab
        run: >-
          python -I -B deploy/build_context.py --revision "$GITHUB_SHA"
          --destination "$RUNNER_TEMP/p1g-source" --output "$RUNNER_TEMP/p1g-source.json"
      - name: Install only public disposable Linux test prerequisites
        timeout-minutes: 8
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          test -x /opt/google/chrome/chrome
          timeout --kill-after=15s 120s sudo -n /usr/bin/env -i PATH=/usr/sbin:/usr/bin:/sbin:/bin DEBIAN_FRONTEND=noninteractive /usr/bin/apt-get update
          timeout --kill-after=15s 240s sudo -n /usr/bin/env -i PATH=/usr/sbin:/usr/bin:/sbin:/bin DEBIAN_FRONTEND=noninteractive /usr/bin/apt-get install -y --no-install-recommends libnss3-tools build-essential libldap2-dev libsasl2-dev libssl-dev libpq-dev
          python -m venv "$RUNNER_TEMP/p1g-venv"
          "$RUNNER_TEMP/p1g-venv/bin/python" -m pip --disable-pip-version-check install -r "$RUNNER_TEMP/p1g-source/requirements-dev.lock"
          "$RUNNER_TEMP/p1g-venv/bin/python" -m pip --disable-pip-version-check install --only-binary=:all: --no-deps --require-hashes -r "$RUNNER_TEMP/p1g-source/qualification/p1g_headless/requirements-headless-linux-cp312.lock"
          "$RUNNER_TEMP/p1g-venv/bin/python" -m pip check
      - name: Check only source contracts without opening a browser or database
        run: 'python -I -B -S "$RUNNER_TEMP/p1g-source/qualification/p1g_headless/run_pure.py"'
      - name: Authenticate scoped certificate, require native negatives, reinstall reviewed Chrome
        timeout-minutes: 15
        env:
          DATABASE_URL: postgresql://p1g:p1g-synthetic-disposable-only@127.0.0.1:${{ job.services.postgres.ports[5432] }}/pamolive_p1g
          PAMOLIVE_TEST_DATABASE_NAME: test_pamolive_p1g_browser
          PAMOLIVE_P1G_DISPOSABLE: '1'
          P1G_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          source="$RUNNER_TEMP/p1g-source"
          python -I -B -S - "$source" "$RUNNER_TEMP/p1g-source.json" "$GITHUB_SHA" <<'PY'
          import hashlib, json, stat, sys
          from pathlib import Path
          root, receipt_path, revision = Path(sys.argv[1]), Path(sys.argv[2]), sys.argv[3]
          def read(path, cap):
              row = path.lstat()
              assert stat.S_ISREG(row.st_mode) and 0 < row.st_size <= cap
              with path.open("rb") as stream:
                  raw = stream.read(cap + 1)
              assert len(raw) == row.st_size and len(raw) <= cap
              return raw
          name = "qualification/p1g_headless/chrome-bootstrap-pins.json"
          expected = "fd6e0d28cfa49caf3c012d67c683f5a7f5298d5c36be1b22791db5b1306fb5f4"
          raw = read(root / name, 131072)
          assert len(raw) <= 131072 and hashlib.sha256(raw).hexdigest() == expected
          receipt = json.loads(read(receipt_path, 4 * 1024**2))
          assert receipt["schema"] == "pamolive.committed-build-context.v1" and receipt["revision"] == revision
          assert receipt["files"][name] == expected
          pins = json.loads(raw)
          rows = {**pins["source_files"], **pins["test_files"]}
          rows.update({"qualification/p1g_headless/chrome_materials/" + name: row["sha256"] for name, row in pins["files"].items()})
          for name, expected in rows.items():
              path = root / name
              assert not path.is_symlink() and stat.S_ISREG(path.lstat().st_mode) and path.stat().st_size <= 131072
              raw = read(path, 131072)
              assert hashlib.sha256(raw).hexdigest() == expected == receipt["files"][name]
          PY
          python -I -B -S "$source/qualification/p1g_headless/run_chrome_pure.py"
          "$RUNNER_TEMP/p1g-venv/bin/python" -I -B -S "$source/qualification/p1g_headless/chrome_bootstrap.py" --pins-sha fd6e0d28cfa49caf3c012d67c683f5a7f5298d5c36be1b22791db5b1306fb5f4 --native-scope-preflight-required
      - name: Exercise the synthetic P1-G JavaScript increment
        timeout-minutes: 12
        env:
          DATABASE_URL: postgresql://p1g:p1g-synthetic-disposable-only@127.0.0.1:${{ job.services.postgres.ports[5432] }}/pamolive_p1g
          PAMOLIVE_TEST_DATABASE_NAME: test_pamolive_p1g_browser
          PAMOLIVE_P1G_DISPOSABLE: '1'
          P1G_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
        run: '"$RUNNER_TEMP/p1g-venv/bin/python" -I -B "$RUNNER_TEMP/p1g-source/qualification/p1g_headless/run_lab.py"'
      - name: Retain only typed synthetic public evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: p1g-headless-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/p1g-headless-${{ github.run_id }}-${{ github.run_attempt }}/*.json
            ${{ runner.temp }}/p1g-headless-${{ github.run_id }}-${{ github.run_attempt }}-chrome/**/*.json
            ${{ runner.temp }}/p1g-headless-${{ github.run_id }}-${{ github.run_attempt }}-chrome/frontend/TEST-fixture-public/certificate-before.pgp
            ${{ runner.temp }}/p1g-headless-${{ github.run_id }}-${{ github.run_attempt }}-chrome/frontend/TEST-fixture-public/certificate-revoked.pgp
            ${{ runner.temp }}/p1g-headless-${{ github.run_id }}-${{ github.run_attempt }}-chrome/frontend/TEST-fixture-public/message.bin
            ${{ runner.temp }}/p1g-headless-${{ github.run_id }}-${{ github.run_attempt }}-chrome/frontend/TEST-fixture-public/signature.sig
            ${{ runner.temp }}/p1g-headless-${{ github.run_id }}-${{ github.run_attempt }}-chrome/frontend/TEST-fixture-public/signature-future.sig
            ${{ runner.temp }}/p1g-headless-${{ github.run_id }}-${{ github.run_attempt }}-chrome/frontend/TEST-fixture-public/signature-expired.sig
            ${{ runner.temp }}/p1g-source.json
          if-no-files-found: warn
          retention-days: 7
