name: Platform checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  postgres-and-container:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: pamolive
          POSTGRES_PASSWORD: ci-only-database-password
          POSTGRES_DB: pamolive
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://pamolive:ci-only-database-password@127.0.0.1:5432/pamolive
      SECRET_KEY: ci-only-secret-not-used-outside-isolated-ci-jobs
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.lock
      - run: ruff check .
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py test --noinput
      - run: docker build -t pamolive-platform:ci .
