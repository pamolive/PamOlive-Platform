name: Platform checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install the isolated security toolchain
        run: |
          python -m pip install --only-binary=:all: --no-deps --require-hashes -r requirements-bootstrap.lock
          python -m pip install -r requirements-security.lock
          python -m pip check
      - name: Verify native inventory and SBOM qualification tools
        run: python -m unittest tests.test_native_inventory tests.test_native_sbom tests.test_native_dns tests.test_image_scan_policy tests.test_database_driver tests.test_ldap_fixture_permissions tests.test_krb5_inventory tests.test_krb5_sbom tests.test_scan_scratch tests.test_build_recipe tests.test_build_context tests.test_runtime_environment tests.test_secret_baseline_metadata tests.test_python_materials
      - name: Verify portable reviewed secret metadata before the unchanged secret scan
        run: python -m deploy.check_secret_baseline .secrets.baseline
      - name: Reject known vulnerabilities in the application lock
        run: python -m pip_audit --strict --no-deps --disable-pip -r requirements.lock -f json -o "$RUNNER_TEMP/pamolive-dependency-audit.json"
      - name: Produce the application CycloneDX SBOM
        if: always()
        run: python -m pip_audit --strict --no-deps --disable-pip -r requirements.lock -f cyclonedx-json -o "$RUNNER_TEMP/pamolive-sbom.cdx.json"
      - name: Reject medium and high severity application findings
        if: always()
        run: python -m bandit -r config platform_core platform_modules -ll -f json -o "$RUNNER_TEMP/pamolive-bandit-application.json"
      - name: Retain all deployment findings for review
        if: always()
        run: python -m bandit -r deploy --exit-zero -f json -o "$RUNNER_TEMP/pamolive-bandit-deploy-all.json"
      - name: Reject high severity deployment findings
        if: always()
        run: python -m bandit -r deploy -lll -f json -o "$RUNNER_TEMP/pamolive-bandit-deploy-high.json"
      - name: Reject new secrets against the reviewed baseline without network verification
        if: always()
        shell: bash
        run: |
          set -o pipefail
          test -f .secrets.baseline
          mkdir -p "$RUNNER_TEMP/pamolive-secret-check"
          cp .secrets.baseline "$RUNNER_TEMP/pamolive-secret-check/.secrets.baseline"
          git ls-files -z | xargs -0 -r python -m detect_secrets.pre_commit_hook --no-verify --json --baseline "$RUNNER_TEMP/pamolive-secret-check/.secrets.baseline"
      - name: Remove source and diagnostic text from Bandit artifacts
        id: redact
        if: always()
        run: >-
          python -m deploy.redact_security_reports
          "$RUNNER_TEMP/pamolive-bandit-application.json"
          "$RUNNER_TEMP/pamolive-bandit-deploy-all.json"
          "$RUNNER_TEMP/pamolive-bandit-deploy-high.json"
      - name: Retain security reports
        if: always() && steps.redact.conclusion == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: pamolive-security-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/pamolive-dependency-audit.json
            ${{ runner.temp }}/pamolive-sbom.cdx.json
            ${{ runner.temp }}/pamolive-bandit-application.json
            ${{ runner.temp }}/pamolive-bandit-deploy-all.json
            ${{ runner.temp }}/pamolive-bandit-deploy-high.json
          if-no-files-found: warn
          retention-days: 7
  postgres-and-container:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: pamolive
          POSTGRES_PASSWORD: ci-only-database-password
          POSTGRES_DB: pamolive
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://pamolive:ci-only-database-password@127.0.0.1:5432/pamolive
      SECRET_KEY: ci-only-secret-not-used-outside-isolated-ci-jobs
      PAMOLIVE_ENCRYPTION_KEY: ci-only-encryption-key-not-used-outside-isolated-ci-jobs
      PAMOLIVE_TEST_DATABASE_NAME: test_pamolive_ci
      PAMOLIVE_LDAP_FIXTURE_PARENT: /var/lib/ldap/pamolive-fixtures-${{ github.run_id }}-${{ github.run_attempt }}
      PSYCOPG_IMPL: c
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install native directory build and isolated wire-test prerequisites
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends build-essential libldap2-dev libsasl2-dev libpq-dev slapd ldap-utils ripgrep acl
      - name: Prepare a new private LDAP fixture area under the existing confined database path
        id: ldap_fixture
        shell: bash
        run: |
          set -euo pipefail
          [[ "$PAMOLIVE_LDAP_FIXTURE_PARENT" =~ ^/var/lib/ldap/pamolive-fixtures-[1-9][0-9]{0,19}-[1-9][0-9]{0,3}$ ]]
          test "$(readlink -f /var/lib/ldap)" = /var/lib/ldap
          test ! -e "$PAMOLIVE_LDAP_FIXTURE_PARENT"
          acl_backup="$RUNNER_TEMP/pamolive-ldap-parent.acl"
          parent_acl_saved=false
          restore_failed_setup() {
            status=$?
            if test "$status" != 0 && test "$parent_acl_saved" = true; then
              sudo setfacl --restore="$acl_backup"
              sudo getfacl -p /var/lib/ldap | cmp - "$acl_backup"
            fi
            return "$status"
          }
          trap restore_failed_setup EXIT
          sudo /usr/bin/python3 -I "$GITHUB_WORKSPACE/deploy/check_ldap_fixture_permissions.py" --actor-uid "$(id -u)" --actor-groups "$(id -G | tr ' ' ',')"
          umask 077
          (set -o noclobber; sudo getfacl -p /var/lib/ldap > "$acl_backup")
          parent_acl_saved=true
          printf 'acl_saved=true\n' >> "$GITHUB_OUTPUT"
          if ! test -x /var/lib/ldap; then
            sudo setfacl -m "u:$(id -u):--x" /var/lib/ldap
          fi
          test -x /var/lib/ldap
          test ! -r /var/lib/ldap
          test ! -w /var/lib/ldap
          sudo install -d -m 700 -o "$(id -u)" -g "$(id -g)" "$PAMOLIVE_LDAP_FIXTURE_PARENT"
          printf 'created=true\n' >> "$GITHUB_OUTPUT"
          if test -f /etc/apparmor.d/usr.sbin.slapd; then
            rg -n '/var/(lib/ldap|tmp)' /etc/apparmor.d/usr.sbin.slapd
          fi
      - name: Install locked application and qualification dependencies
        run: |
          python -m pip install --only-binary=:all: --no-deps --require-hashes -r requirements-bootstrap.lock
          python -m pip install --only-binary=:all: --no-deps --require-hashes -r requirements-native-build.lock
          python -m pip wheel --no-build-isolation --no-deps --require-hashes --wheel-dir "$RUNNER_TEMP/pamolive-database-wheels" -r requirements-database-build.lock
          python -m pip install --find-links="$RUNNER_TEMP/pamolive-database-wheels" -r requirements-dev.lock -r requirements-security.lock
      - run: python -m pip check
      - run: ruff check .
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - name: Verify directory protocols and persistent tenant-scoped inventory
        env:
          PAMOLIVE_TEST_DATABASE_NAME: test_pamolive_directory
        run: |
          set -o pipefail
          python -c "import resource; print('Runner RLIMIT_NOFILE:', resource.getrlimit(resource.RLIMIT_NOFILE)); print('LDAP peer child cap: 256; parent unchanged')"
          python -c "from tests.fixtures.ldap_directory import available; assert available(), 'Native LDAP gate must run, not skip'"
          python manage.py test tests.test_directory_adapters tests.test_directory_ldap_wire tests.test_directory_peer_limits tests.test_directory_inventory tests.test_directory_inventory_concurrency tests.test_directory_redteam tests.test_directory_views tests.test_directory_views_redteam tests.test_directory_restore --noinput 2>&1 | tee "$RUNNER_TEMP/pamolive-directory-tests.log"
      - name: Verify P1 contracts, Identity, Governance, Observe and module isolation
        run: >-
          python manage.py test tests.test_access_contract tests.test_p1_module_isolation
          tests.test_access_contract_views tests.test_access_contract_concurrency
          tests.test_identity360 tests.test_identity360_concurrency tests.test_mover_authority
          tests.test_governance_workspace tests.test_governance_workspace_concurrency
          tests.test_governance_exception_restore tests.test_module_activation_authority
          tests.test_observe_story tests.test_observe_concurrency tests.test_synology_preparation
          tests.test_jobs_database_recovery tests.test_jobs_security_recovery
          tests.test_restore_diagnostics
          --noinput
      - name: Verify real P0 trust ceremonies in the synthetic HA fixture
        env:
          PAMOLIVE_TEST_DATABASE_NAME: test_pamolive_ha_trust
        run: python manage.py test tests.test_active_active tests.test_active_active_trust --noinput
      - name: Verify the complete offline restore corpus with tenant-scoped provenance
        env:
          PAMOLIVE_TEST_DATABASE_NAME: test_pamolive_restore_source
        run: python manage.py test tests.test_restore_full_corpus --noinput
      - name: Run all local contracts, isolation and P0 regressions on PostgreSQL
        shell: bash
        run: |
          set -o pipefail
          python manage.py test --noinput --verbosity 2 2>&1 | tee "$RUNNER_TEMP/pamolive-postgres-tests.log"
      - name: Retain PostgreSQL and directory results, including failures and skips
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: pamolive-postgres-tests-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/pamolive-postgres-tests.log
            ${{ runner.temp }}/pamolive-directory-tests.log
          if-no-files-found: warn
          retention-days: 7
      - name: Verify real HTTPS OIDC round-trip, local MFA and tenant boundaries
        run: python manage.py test tests.test_oidc tests.test_oidc_tls --noinput
      - name: Verify a separately installed signed module on PostgreSQL
        run: python -m deploy.check_extensions --postgres
      - name: Verify the signed V3 periodic signals with a separately installed wheel
        run: python -m deploy.check_extensions --postgres --periodic
      - name: Prepare the committed Docker context without local or generated files
        run: >-
          python -m deploy.build_context --revision "$GITHUB_SHA"
          --destination "$RUNNER_TEMP/pamolive-committed-context"
          --output "$RUNNER_TEMP/pamolive-committed-context.json"
      - name: Verify that local credentials cannot enter the image
        run: |
          cd "$RUNNER_TEMP/pamolive-committed-context"
          printf 'must-not-enter-the-image' > .bootstrap-admin
          cp .bootstrap-admin .image-private-check.dump
          mkdir .image-private-context config/.nas-access
          cp .bootstrap-admin .image-private-context/undesignated.txt
          cp .bootstrap-admin config/.nas-access/key-without-extension
          cp .bootstrap-admin config/qualification.pem
          cp .bootstrap-admin tests/.env.qualification
          cp .bootstrap-admin tests/qualification.tar
          docker build --target production --provenance=false --sbom=false \
            --label "org.opencontainers.image.source=https://github.com/pamolive/PamOlive-Platform" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "io.pamolive.source.license=AGPL-3.0-or-later" \
            -t pamolive-platform:ci .
          docker run --rm -i --network none --entrypoint python pamolive-platform:ci - <<'PY'
          from importlib.util import find_spec
          from pathlib import Path

          root = Path("/app")
          paths = (
              ".bootstrap-admin", ".env", ".image-private-check.dump",
              ".image-private-context", "config/.nas-access", "config/qualification.pem",
              "tests/.env.qualification", "tests/qualification.tar",
          )
          assert not any((root / name).exists() for name in paths)
          assert (root / ".env.example").is_file()
          assert not Path("/opt/pamolive-test").exists()
          assert find_spec("PIL") is None
          PY
      - name: Verify native SSH/RDP plugins without contacting a target
        run: docker run --rm --user 1000:1000 --network none --cap-drop ALL --security-opt no-new-privileges --read-only --tmpfs /tmp:size=64m,mode=1777 --entrypoint python pamolive-platform:ci -m deploy.check_guacd
      - name: Prepare a separately signed extension wheel
        run: python -m deploy.prepare_extension_fixture /tmp/pamolive-extension-image-context
      - name: Build and verify the single-container extension image
        run: |
          docker build --build-arg PAMOLIVE_BASE_IMAGE=pamolive-platform:ci -t pamolive-platform:extension-ci /tmp/pamolive-extension-image-context
          docker run --rm --network none --entrypoint python pamolive-platform:extension-ci -c "from pathlib import Path; from importlib.util import find_spec; assert not Path('/app/.env').exists(); assert not Path('/app/publisher-private.pem').exists(); assert not Path('/opt/pamolive-test').exists(); assert find_spec('PIL') is None; assert not Path('/app/db.sqlite3').exists()"
      - name: Verify installed extension routes, permissions and isolation in the built image
        run: docker run --rm --user 1000:1000 --network host --cap-drop ALL --security-opt no-new-privileges --read-only --tmpfs /tmp:size=64m,mode=1777 -e DATABASE_URL -e SECRET_KEY -e PAMOLIVE_TEST_DATABASE_NAME=test_pamolive_extensions -e PAMOLIVE_REQUIRE_EXTENSION_ASSETS=1 --entrypoint python pamolive-platform:extension-ci manage.py test tests.test_extensions_runtime --keepdb --noinput
      - name: Verify native SSH pinning and keyboard round-trip on a disposable fixture
        run: docker run --rm --user 1000:1000 --network none --cap-drop ALL --security-opt no-new-privileges --read-only --tmpfs /tmp:size=64m,mode=1777 --entrypoint python pamolive-platform:ci -m deploy.check_native_ssh
      - name: Build test-only headless RDP peer
        run: docker build --target native-test -t pamolive-platform:native-test "$RUNNER_TEMP/pamolive-committed-context"
      - name: Verify native RDP NLA, certificate pin and keyboard round-trip
        run: docker run --rm --user 1000:1000 --network none --dns 127.0.0.1 --cap-drop ALL --security-opt no-new-privileges --read-only --tmpfs /tmp:size=64m,mode=1777 --entrypoint python pamolive-platform:native-test -m deploy.check_native_rdp
      - name: Verify synthetic NLA behavior under negative and silent loopback DNS
        run: docker run --rm --user 1000:1000 --network none --dns 127.0.0.1 --cap-drop ALL --security-opt no-new-privileges --read-only --tmpfs /tmp:size=64m,mode=1777 --entrypoint python pamolive-platform:native-test -m deploy.check_native_dns
      - name: Verify real WebSocket SSH transport and recording on PostgreSQL
        run: docker run --rm --user 1000:1000 --network host --cap-drop ALL --security-opt no-new-privileges --read-only --tmpfs /tmp:size=64m,mode=1777 -e DATABASE_URL -e SECRET_KEY -e PAM_REQUIRE_NATIVE=1 --entrypoint python pamolive-platform:ci manage.py test tests.test_pam_relay_e2e --noinput
      - name: Verify real WebSocket RDP NLA, revocation, capture and redirection defense
        run: docker run --rm --user 1000:1000 --network host --dns 127.0.0.1 --cap-drop ALL --security-opt no-new-privileges --read-only --tmpfs /tmp:size=64m,mode=1777 -e DATABASE_URL -e SECRET_KEY -e PAM_REQUIRE_NATIVE=1 -e PAM_REQUIRE_RDP=1 --entrypoint python pamolive-platform:native-test manage.py test tests.test_pam_rdp_e2e --noinput
      - name: Verify single-container runtime privilege separation
        run: |
          docker run --rm --network host -e DATABASE_URL -e SECRET_KEY --entrypoint python pamolive-platform:ci manage.py migrate --noinput
          docker run -d --name pamolive-platform-runtime-ci --init --network host --cap-drop ALL --cap-add SETUID --cap-add SETGID --cap-add KILL --security-opt no-new-privileges --read-only --tmpfs /tmp:size=64m,mode=1777 -e DATABASE_URL -e SECRET_KEY pamolive-platform:ci
          trap 'docker logs pamolive-platform-runtime-ci; docker rm -f pamolive-platform-runtime-ci' EXIT
          for attempt in $(seq 1 30); do
            if docker exec pamolive-platform-runtime-ci python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/',timeout=1)"; then break; fi
            sleep 1
          done
          docker exec pamolive-platform-runtime-ci python -m deploy.check_runtime
      - name: Verify two active nodes, HTTP and PAM failover and a database partition
        run: |
          python -c "import os, psycopg; connection=psycopg.connect(os.environ['DATABASE_URL'], autocommit=True); connection.execute('CREATE DATABASE test_pamolive_ha OWNER pamolive'); connection.close()"
          ha_network=$(docker inspect '${{ job.services.postgres.id }}' --format '{{json .NetworkSettings.Networks}}' | python -c "import json,sys; print(next(iter(json.load(sys.stdin))))")
          python -m deploy.prepare_active_active_environment /tmp/pamolive-ha-ci.env --image pamolive-platform:ci --network "$ha_network" --host postgres
          python -m deploy.check_active_active --env-file /tmp/pamolive-ha-ci.env --native-pam --native-rdp --database-partition
      - name: Restore a populated archive with restricted credentials and intact proofs
        run: python -m deploy.check_restore_ci --postgres-container '${{ job.services.postgres.id }}' --ha-env-file /tmp/pamolive-ha-ci.env
      - name: Verify controlled historical upgrade, rollback and exact old-column preservation
        run: python -m deploy.check_upgrade_ci --postgres-container '${{ job.services.postgres.id }}' --ha-env-file /tmp/pamolive-ha-ci.env
      - name: Verify the image-only Compose runtime is identical
        run: |
          export ENV_FILE="$RUNNER_TEMP/compose-qualification.env"
          : > "$ENV_FILE"
          export DATABASE_URL=postgresql://fixture:fixture@db.example.test/pamolive
          export SECRET_KEY=compose-qualification-only
          export PAMOLIVE_IMAGE=ghcr.io/pamolive/pamolive-platform@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          docker compose --env-file "$ENV_FILE" -f compose.yml config --format json > "$RUNNER_TEMP/compose-source.json"
          docker compose --env-file "$ENV_FILE" -f compose.registry.yml config --format json > "$RUNNER_TEMP/compose-registry.json"
          python -m deploy.qualified_image compare-compose "$RUNNER_TEMP/compose-source.json" "$RUNNER_TEMP/compose-registry.json" --image "$PAMOLIVE_IMAGE"
      - name: Export and verify the exact qualified image
        run: |
          python -m deploy.qualified_image export "$RUNNER_TEMP/pamolive-qualified-image" --revision "$GITHUB_SHA"
          python -m deploy.qualified_image verify "$RUNNER_TEMP/pamolive-qualified-image" --revision "$GITHUB_SHA"
          docker image load --input "$RUNNER_TEMP/pamolive-qualified-image/pamolive-linux-amd64.tar"
          python -m deploy.qualified_image verify "$RUNNER_TEMP/pamolive-qualified-image" --revision "$GITHUB_SHA" --loaded
      - name: Verify installed native binaries and bind the combined SBOM to the tested image
        shell: bash
        run: |
          set -euo pipefail
          proof="$RUNNER_TEMP/pamolive-image-security"
          mkdir -m 700 "$proof"
          image_ref=$(docker image inspect pamolive-platform:ci --format '{{.Id}}')
          config_id=$(python -c 'import json,os; from pathlib import Path; print(json.loads((Path(os.environ["RUNNER_TEMP"])/"pamolive-qualified-image/qualified-image.json").read_text())["image_id"])')
          docker run --rm --user "$(id -u):$(id -g)" --network none --cap-drop ALL --security-opt no-new-privileges --read-only --tmpfs /tmp:size=32m,mode=1777 --entrypoint python "$image_ref" -c 'from pathlib import Path; import sys; sys.stdout.buffer.write(Path("/opt/pamolive-native-manifest.json").read_bytes())' > "$proof/native-manifest.json"
          docker run --rm --user "$(id -u):$(id -g)" --network none --cap-drop ALL --security-opt no-new-privileges --read-only --tmpfs /tmp:size=32m,mode=1777 --mount "type=bind,src=$proof,dst=/proof" --entrypoint python "$image_ref" -m deploy.native_inventory --output /proof/native-report.json
          docker run --rm --user "$(id -u):$(id -g)" --network none --cap-drop ALL --security-opt no-new-privileges --read-only --tmpfs /tmp:size=32m,mode=1777 --mount "type=bind,src=$proof,dst=/proof" --entrypoint python "$image_ref" -m deploy.check_database_driver --output /proof/database-driver.json
          docker run --rm --user "$(id -u):$(id -g)" --network none --cap-drop ALL --security-opt no-new-privileges --read-only --tmpfs /tmp:size=32m,mode=1777 --mount "type=bind,src=$proof,dst=/proof" --entrypoint python "$image_ref" -m deploy.krb5_inventory --verify --output /proof/krb5-report.json
          docker run --rm -i --user "$(id -u):$(id -g)" --network none --cap-drop ALL --security-opt no-new-privileges --read-only --tmpfs /tmp:size=32m,mode=1777 --mount "type=bind,src=$proof,dst=/proof" --entrypoint python "$image_ref" - <<'PY'
          import os
          from pathlib import Path
          from deploy import krb5_inventory as gate

          os.umask(0o077)
          manifest = gate.inventory()
          root = Path("/")
          raw = gate.read_file(root, gate.MANIFEST_PATH, 2 * 1024**2)
          assert gate.read_json(Path(gate.MANIFEST_PATH)) == manifest
          target = Path("/proof/krb5-evidence")
          target.mkdir(mode=0o700)
          with Path("/proof/krb5-manifest.json").open("xb") as output:
              output.write(raw)
          names = {"inventory.json", "provenance.json", *manifest["provenance"]["evidence"]}
          for name in sorted(names):
              gate.evidence_name(name)
              data = gate.read_file(root, gate.PREFIX + "/" + name, 32 * 1024**2)
              with (target / name).open("xb") as output:
                  output.write(data)
          PY
          python -m deploy.krb5_sbom --manifest "$proof/krb5-manifest.json" --report "$proof/krb5-report.json" --image-digest-kind image_config --image-digest "$config_id" --output "$proof/krb5-backport.cdx.json"
          python -m pip_audit --strict --no-deps --disable-pip -r requirements.lock -f cyclonedx-json -o "$proof/application.cdx.json"
          python -m deploy.native_sbom --app-sbom "$proof/application.cdx.json" --native-manifest "$proof/native-manifest.json" --native-report "$proof/native-report.json" --image-digest-kind image_config --image-digest "$config_id" --output "$proof/combined.cdx.json"
      - name: Verify a fresh Compose installation of the loaded image without building
        run: |
          export PAMOLIVE_TEST_DATABASE_NETWORK
          PAMOLIVE_TEST_DATABASE_NETWORK=$(docker inspect '${{ job.services.postgres.id }}' --format '{{json .NetworkSettings.Networks}}' | python -c "import json,sys; print(next(iter(json.load(sys.stdin))))")
          bash deploy/check_registry_install_ci.sh
      - name: Scan the exact image, qualify native matching and enforce individually reviewed findings
        run: bash deploy/check_image_scan_ci.sh
      - name: Retain image identity and full security evidence even when promotion is blocked
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: pamolive-image-security-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/pamolive-image-security/
            ${{ runner.temp }}/pamolive-qualified-image/qualified-image.json
            ${{ runner.temp }}/pamolive-committed-context.json
          if-no-files-found: warn
          retention-days: 7
      - name: Retain the qualified image for main publication
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'pamolive/PamOlive-Platform'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: pamolive-linux-amd64-${{ github.sha }}
          path: ${{ runner.temp }}/pamolive-qualified-image/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - name: Remove the empty private LDAP fixture and restore its parent ACL
        if: always() && steps.ldap_fixture.outputs.acl_saved == 'true'
        run: |
          set -euo pipefail
          restore_parent_acl() {
            sudo setfacl --restore="$RUNNER_TEMP/pamolive-ldap-parent.acl"
            sudo getfacl -p /var/lib/ldap | cmp - "$RUNNER_TEMP/pamolive-ldap-parent.acl"
          }
          trap restore_parent_acl EXIT
          [[ "$PAMOLIVE_LDAP_FIXTURE_PARENT" =~ ^/var/lib/ldap/pamolive-fixtures-[1-9][0-9]{0,19}-[1-9][0-9]{0,3}$ ]]
          if test '${{ steps.ldap_fixture.outputs.created }}' = true && test -d "$PAMOLIVE_LDAP_FIXTURE_PARENT"; then
            test ! -L "$PAMOLIVE_LDAP_FIXTURE_PARENT"
            test "$(stat -c %u "$PAMOLIVE_LDAP_FIXTURE_PARENT")" = "$(id -u)"
            # The runner intentionally has no write permission on the stock
            # parent. Root removes only this exact, verified empty child.
            sudo rmdir -- "$PAMOLIVE_LDAP_FIXTURE_PARENT"
          fi
