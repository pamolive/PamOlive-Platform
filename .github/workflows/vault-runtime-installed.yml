name: Installed Vault reservation runtime
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      transfer_verified_wheels:
        description: Reinstall the verified wheels in the private Vault laboratory image
        type: boolean
        default: false
      run_synthetic_lab:
        description: Execute the dedicated Vault PostgreSQL and mutual TLS laboratory
        type: boolean
        default: false
      run_synthetic_restore:
        description: Select the logical restoration scenario for the fresh Vault laboratory
        type: boolean
        default: false
      build_witness_consumer:
        description: Build the separate installed W1 witness consumer and run its offline tests
        type: boolean
        default: false
      run_witness_lab:
        description: Qualify the installed witness with dedicated PostgreSQL clusters and mutual TLS
        type: boolean
        default: false
      run_witness_fence:
        description: Exercise concurrent Vault closure in the installed witness lab
        type: boolean
        default: false
      run_witness_history:
        description: Verify read-only witness receipts after Vault and witness closure
        type: boolean
        default: false
      run_witness_restart:
        description: Replace the closed witness process with its read-only recovery listener
        type: boolean
        default: false
      run_witness_restore:
        description: Restore sealed witness evidence to a fresh database and verify read-only recovery
        type: boolean
        default: false
      run_witness_restore_cluster:
        description: Stop the original witness database and recover into a fresh PostgreSQL cluster
        type: boolean
        default: false
      run_witness_pitr:
        description: Replay physical PostgreSQL WAL to the named witness closure point
        type: boolean
        default: false
      run_witness_audit_archive:
        description: Verify the restored audit chain against the original witness checkpoint
        type: boolean
        default: false
      run_witness_signed_anchor:
        description: Verify the signed external checkpoint after restoring the witness
        type: boolean
        default: false
      run_witness_anchor_store:
        description: Reopen and transfer a separately retained checkpoint after PostgreSQL recovery
        type: boolean
        default: false
      run_witness_anchor_handoff:
        description: Reimport the signed synthetic PITR checkpoint on another GitHub runner
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: vault-runtime-installed-${{ github.ref }}
  cancel-in-progress: false
jobs:
  installed-vault-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    outputs:
      anchor_sha: ${{ steps.anchor_refs.outputs.anchor_sha }}
      anchor_public_hex: ${{ steps.anchor_refs.outputs.public_hex }}
      anchor_boot_sha: ${{ steps.anchor_refs.outputs.boot_sha }}
      anchor_artifact_id: ${{ steps.anchor_artifact.outputs.artifact-id }}
    env:
      VAULT_SOURCES_SHA: aa33214f025847f8de537f95ede173e8f8e4916cd52495060b8804758abc4f9b
      VAULT_ASSETS_SHA: 71d26e9cc4b1c27465f875879fff28c0c657688f70f797b91f174f86fed6a1eb
      VAULT_PAYLOAD_SHA: d9e7ff40d7395a109833225b5051feb1f85f6dc9f7061a07c3fa97110bc6b4a6
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - name: Check all runner bytes before Python or acquisition
        shell: bash
        run: |
          set -euo pipefail
          cd qualification/vault_runtime_installed_ci
          printf '%s  source-checksums.sha256\n' "$VAULT_SOURCES_SHA" | sha256sum --check --strict
          sha256sum --check --strict source-checksums.sha256
          printf 'VAULT_WORK=%s/pamolive-p2-installed-%s-%s\n' "$RUNNER_TEMP" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"
          printf 'VAULT_MATERIALS=%s/vault-public-materials-%s-%s\n' "$RUNNER_TEMP" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Capture the exact 36 inputs from the real component paths
        run: >-
          python -I -B qualification/vault_runtime_installed_ci/capture_inputs.py
          --repository "$GITHUB_WORKSPACE" --payload-sha256 "$VAULT_PAYLOAD_SHA"
      - name: Seven adversarial checkout capture tests
        run: python -I -B qualification/vault_runtime_installed_ci/capture_adversarial.py
      - name: Six startup-hook refusals without executing hooks
        run: python -I -B qualification/vault_runtime_installed_ci/startup_adversarial.py
      - name: Eight real kernel-profile parser composition tests
        run: python -I -B qualification/vault_runtime_installed_ci/mount_profile_adversarial.py
      - name: Six real public lab-helper source regressions without SQL
        run: python -I -B -S qualification/vault_runtime_installed_ci/serve_lab_adversarial.py
      - name: Sixty-five pure harness tests without production imports
        run: python -I -B qualification/vault_runtime_installed_ci/run_pure.py
      - name: Verify the private handoff and refuse changed wheel bytes
        run: python -I -B -S qualification/vault_runtime_installed_ci/wheel_transfer_adversarial.py
      - name: Verify lab Docker ownership and role isolation under doubles
        run: python -I -B -S qualification/vault_runtime_installed_ci/lab_docker_adversarial.py
      - name: Verify W1 dual-cluster ownership and provisioning under doubles
        run: |
          set -euo pipefail
          python -I -B -S qualification/vault_runtime_installed_ci/witness_ownership_adversarial.py
          python -I -B -S qualification/vault_runtime_installed_ci/witness_postgres_adversarial.py
          python -I -B -S qualification/vault_runtime_installed_ci/witness_runner_adversarial.py
          python -I -B -S qualification/vault_runtime_installed_ci/witness_restore_storage_adversarial.py
          python -I -B -S qualification/vault_runtime_installed_ci/witness_pitr_storage_adversarial.py
      - name: Require the installed consumer before running the synthetic lab
        if: inputs.run_synthetic_lab == true && inputs.transfer_verified_wheels != true
        run: exit 42
      - name: Require an explicitly selected laboratory for logical restoration
        if: inputs.run_synthetic_restore == true && inputs.run_synthetic_lab != true
        run: exit 42
      - name: Require a dedicated W1 build with the verified Vault consumer input
        if: inputs.build_witness_consumer == true && (inputs.transfer_verified_wheels != true || inputs.run_synthetic_lab == true)
        run: exit 42
      - name: Require the separately installed witness for the dual-cluster lab
        if: inputs.run_witness_lab == true && inputs.build_witness_consumer != true
        run: exit 42
      - name: Require a dedicated witness lab before exercising Vault closure
        if: inputs.run_witness_fence == true && inputs.run_witness_lab != true
        run: exit 42
      - name: Require Vault closure before testing historical witness receipts
        if: inputs.run_witness_history == true && inputs.run_witness_fence != true
        run: exit 42
      - name: Require historical witness checks before exercising closed restart
        if: inputs.run_witness_restart == true && inputs.run_witness_history != true
        run: exit 42
      - name: Require closed restart before qualifying restoration of witness evidence
        if: inputs.run_witness_restore == true && inputs.run_witness_restart != true
        run: exit 42
      - name: Require a distinct closed restart scenario before changing witness clusters
        if: inputs.run_witness_restore_cluster == true && (inputs.run_witness_restart != true || inputs.run_witness_restore == true)
        run: exit 42
      - name: Require the dedicated database recovery scenario for PITR
        if: inputs.run_witness_pitr == true && inputs.run_witness_restore_cluster != true
        run: exit 42
      - name: Require PITR before comparing the restored audit chain
        if: inputs.run_witness_audit_archive == true && inputs.run_witness_pitr != true
        run: exit 42
      - name: Require the archive campaign for a signed checkpoint
        if: inputs.run_witness_signed_anchor == true && inputs.run_witness_audit_archive != true
        run: exit 42
      - name: Require a signed checkpoint before qualifying its custody
        if: inputs.run_witness_anchor_store == true && inputs.run_witness_signed_anchor != true
        run: exit 42
      - name: Require recovered custody before a synthetic cross-runner handoff
        if: inputs.run_witness_anchor_handoff == true && (inputs.run_witness_anchor_store != true || github.repository != 'pamolive/PamOlive-Platform')
        run: exit 42
      - name: Seventeen existing wheel DATA regressions
        run: python -I -B qualification/vault_reservation/test_wheel.py
      - name: Verify closed source and independent expected bindings
        run: >-
          python -I -B qualification/vault_runtime_installed_ci/workload_cli.py verify
          --assets-sha256 "$VAULT_ASSETS_SHA" --work "$VAULT_WORK"
      - name: Acquire exactly sixteen pinned public wheels on the host
        timeout-minutes: 32
        run: >-
          python -I -B qualification/vault_runtime_installed_ci/workload_cli.py acquire
          --assets-sha256 "$VAULT_ASSETS_SHA" --work "$VAULT_WORK"
          --repository "$GITHUB_WORKSPACE" --materials "$VAULT_MATERIALS"
      - name: Prepare three closed read-only input mounts
        id: prepare
        env:
          VAULT_TRANSFER_VERIFIED_WHEELS: ${{ inputs.transfer_verified_wheels }}
        shell: bash
        run: |
          set -euo pipefail
          options=()
          if [[ "$VAULT_TRANSFER_VERIFIED_WHEELS" == true ]]; then
            options+=(--transfer-verified-wheels)
          fi
          python -I -B qualification/vault_runtime_installed_ci/workload_cli.py prepare \
            --assets-sha256 "$VAULT_ASSETS_SHA" --work "$VAULT_WORK" \
            --materials "$VAULT_MATERIALS" "${options[@]}"
      - name: Explicitly pull only the pinned public Python S0
        timeout-minutes: 6
        run: >-
          python -I -B qualification/vault_runtime_installed_ci/workload_cli.py pull
          --assets-sha256 "$VAULT_ASSETS_SHA" --work "$VAULT_WORK"
      - name: Build and install three wheels offline then run the installed 52 tests
        timeout-minutes: 17
        run: >-
          python -I -B qualification/vault_runtime_installed_ci/workload_cli.py run
          --assets-sha256 "$VAULT_ASSETS_SHA" --work "$VAULT_WORK"
      - name: Reconcile only the same durable reservation and preserve uncertainty
        if: always() && steps.prepare.outcome == 'success'
        timeout-minutes: 2
        run: >-
          python -I -B qualification/vault_runtime_installed_ci/workload_cli.py cleanup
          --assets-sha256 "$VAULT_ASSETS_SHA" --work "$VAULT_WORK"
      - name: Verify that the isolated handoff was retained privately
        if: inputs.transfer_verified_wheels == true
        shell: bash
        run: |
          set -euo pipefail
          transfer="$VAULT_WORK/verified-wheels.bin"
          test -f "$transfer"
          test ! -L "$transfer"
          test -s "$transfer"
          test "$(stat -c '%a' "$transfer")" = 600
      - name: Prepare the isolated Vault consumer from the accepted wheel handoff
        if: inputs.transfer_verified_wheels == true
        timeout-minutes: 12
        run: >-
          python -I -B -S qualification/vault_runtime_installed_ci/consumer_inputs.py
          --assets-sha256 "$VAULT_ASSETS_SHA" --work "$VAULT_WORK"
          --materials "$VAULT_MATERIALS"
      - name: Install the same wheels in a separate image and verify the native driver offline
        if: inputs.transfer_verified_wheels == true && inputs.build_witness_consumer != true
        timeout-minutes: 22
        env:
          DOCKER_BUILDKIT: '1'
        shell: bash
        run: |
          set -euo pipefail
          context="$VAULT_WORK/verified-consumer-context"
          descriptor_sha=$(sha256sum "$context/descriptor.json")
          inventories_sha=$(sha256sum "$context/inventories.json")
          docker --config "$VAULT_WORK/docker-config" -H unix:///var/run/docker.sock build \
            --platform linux/amd64 --no-cache --progress plain \
            --build-arg "VAULT_DESCRIPTOR_SHA256=${descriptor_sha%% *}" \
            --build-arg "VAULT_INVENTORIES_SHA256=${inventories_sha%% *}" \
            --iidfile "$VAULT_WORK/vault-consumer.iid" \
            --file qualification/vault_runtime_installed_ci/Dockerfile.consumer \
            "$context"
          grep -qxE 'sha256:[0-9a-f]{64}' "$VAULT_WORK/vault-consumer.iid"
      - name: Build the fourth wheel independently and qualify the installed W1 package offline
        if: inputs.build_witness_consumer == true && inputs.transfer_verified_wheels == true
        timeout-minutes: 22
        env:
          DOCKER_BUILDKIT: '1'
          VAULT_WITNESS_LAB: ${{ inputs.run_witness_lab }}
        shell: bash
        run: |
          set -euo pipefail
          python -I -B -S qualification/vault_runtime_installed_ci/witness_inputs.py --work "$VAULT_WORK"
          context="$VAULT_WORK/verified-consumer-context"
          descriptor_sha=$(sha256sum "$context/descriptor.json")
          inventories_sha=$(sha256sum "$context/inventories.json")
          options=(--target witness-public-receipt --output "type=local,dest=$VAULT_WORK/witness-public")
          if [[ "$VAULT_WITNESS_LAB" == true ]]; then
            options=(--target witness-consumer --iidfile "$VAULT_WORK/witness-consumer.iid")
          fi
          cat qualification/vault_runtime_installed_ci/Dockerfile.consumer \
              qualification/vault_runtime_installed_ci/Dockerfile.witness \
            | docker --config "$VAULT_WORK/docker-config" -H unix:///var/run/docker.sock build \
              --platform linux/amd64 --no-cache --progress plain "${options[@]}" \
              --build-arg "VAULT_DESCRIPTOR_SHA256=${descriptor_sha%% *}" \
              --build-arg "VAULT_INVENTORIES_SHA256=${inventories_sha%% *}" \
              --file - "$context"
          if [[ "$VAULT_WITNESS_LAB" == true ]]; then
            grep -qxE 'sha256:[0-9a-f]{64}' "$VAULT_WORK/witness-consumer.iid"
          else
            receipt="$VAULT_WORK/witness-public/witness-public.json"
            test -f "$receipt" && test ! -L "$receipt" && test -s "$receipt"
          fi
      - name: Run the installed witness on dedicated PostgreSQL and mutual TLS
        if: inputs.run_witness_lab == true && inputs.build_witness_consumer == true && inputs.transfer_verified_wheels == true
        timeout-minutes: 10
        env:
          VAULT_WITNESS_FENCE: ${{ inputs.run_witness_fence }}
          VAULT_WITNESS_HISTORY: ${{ inputs.run_witness_history }}
          VAULT_WITNESS_RESTART: ${{ inputs.run_witness_restart }}
          VAULT_WITNESS_RESTORE: ${{ inputs.run_witness_restore }}
          VAULT_WITNESS_RESTORE_CLUSTER: ${{ inputs.run_witness_restore_cluster }}
          VAULT_WITNESS_PITR: ${{ inputs.run_witness_pitr }}
          VAULT_WITNESS_AUDIT_ARCHIVE: ${{ inputs.run_witness_audit_archive }}
          VAULT_WITNESS_SIGNED_ANCHOR: ${{ inputs.run_witness_signed_anchor }}
          VAULT_WITNESS_ANCHOR_STORE: ${{ inputs.run_witness_anchor_store }}
          VAULT_WITNESS_ANCHOR_HANDOFF: ${{ inputs.run_witness_anchor_handoff }}
        shell: bash
        run: |
          set -euo pipefail
          options=()
          if [[ "$VAULT_WITNESS_FENCE" == true ]]; then
            options+=(--fence)
          fi
          if [[ "$VAULT_WITNESS_HISTORY" == true ]]; then
            options+=(--history)
          fi
          if [[ "$VAULT_WITNESS_RESTART" == true ]]; then
            options+=(--restart-history)
          fi
          if [[ "$VAULT_WITNESS_RESTORE" == true ]]; then
            options+=(--restore-witness)
          fi
          if [[ "$VAULT_WITNESS_RESTORE_CLUSTER" == true ]]; then
            options+=(--restore-cluster)
          fi
          if [[ "$VAULT_WITNESS_PITR" == true ]]; then
            options+=(--pitr)
          fi
          if [[ "$VAULT_WITNESS_AUDIT_ARCHIVE" == true ]]; then
            options+=(--audit-archive)
          fi
          if [[ "$VAULT_WITNESS_SIGNED_ANCHOR" == true ]]; then
            options+=(--signed-audit-anchor)
          fi
          if [[ "$VAULT_WITNESS_ANCHOR_STORE" == true ]]; then
            options+=(--audit-anchor-store)
          fi
          if [[ "$VAULT_WITNESS_ANCHOR_HANDOFF" == true ]]; then
            options+=(--audit-anchor-handoff)
          fi
          python -I -B -S qualification/vault_runtime_installed_ci/run_witness_lab.py \
            --work "$VAULT_WORK" "${options[@]}"
      - name: Publish the references as separate job outputs
        if: inputs.run_witness_anchor_handoff == true
        id: anchor_refs
        run: python -I -B -S qualification/vault_runtime_installed_ci/witness_anchor_handoff.py publish "$VAULT_WORK"
      - name: Upload only the synthetic signed checkpoint
        if: inputs.run_witness_anchor_handoff == true
        id: anchor_artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: witness-synthetic-anchor-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.VAULT_WORK }}/anchor-handoff.json
          if-no-files-found: error
          retention-days: 1
      - name: Run the installed Vault tests on dedicated PostgreSQL and mutual TLS
        if: inputs.run_synthetic_lab == true && inputs.transfer_verified_wheels == true
        timeout-minutes: 10
        env:
          VAULT_SYNTHETIC_RESTORE: ${{ inputs.run_synthetic_restore }}
        shell: bash
        run: |
          set -euo pipefail
          options=()
          if [[ "$VAULT_SYNTHETIC_RESTORE" == true ]]; then
            options+=(--restore)
          fi
          python -I -B -S qualification/vault_runtime_installed_ci/run_installed_lab.py \
            --work "$VAULT_WORK" "${options[@]}"
      - name: Retain public qualification and cleanup facts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always() && env.VAULT_WORK != ''
        with:
          name: vault-installed-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.VAULT_WORK }}/public-report.json
            ${{ env.VAULT_WORK }}/cleanup-public.json
            ${{ env.VAULT_WORK }}/lab-public.json
            ${{ env.VAULT_WORK }}/witness-public/witness-public.json
            ${{ env.VAULT_WORK }}/witness-lab-public.json
            qualification/vault_runtime_installed_ci/checkout-capture.json
            ${{ env.VAULT_MATERIALS }}/acquisition.json
          if-no-files-found: error
          retention-days: 7
  restore-witness-anchor:
    if: github.repository == 'pamolive/PamOlive-Platform' && inputs.run_witness_anchor_handoff == true
    needs: installed-vault-runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      ANCHOR_ARTIFACT_ID: ${{ needs.installed-vault-runtime.outputs.anchor_artifact_id }}
      ANCHOR_SHA: ${{ needs.installed-vault-runtime.outputs.anchor_sha }}
      ANCHOR_PUBLIC_HEX: ${{ needs.installed-vault-runtime.outputs.anchor_public_hex }}
      ANCHOR_SOURCE_BOOT: ${{ needs.installed-vault-runtime.outputs.anchor_boot_sha }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - name: Verify the exact checkout and required job outputs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          [[ "$ANCHOR_ARTIFACT_ID" =~ ^[1-9][0-9]{0,18}$ ]]
          [[ "$ANCHOR_SHA" =~ ^[0-9a-f]{64}$ ]]
          [[ "$ANCHOR_PUBLIC_HEX" =~ ^[0-9a-f]{64}$ ]]
          [[ "$ANCHOR_SOURCE_BOOT" =~ ^[0-9a-f]{64}$ ]]
          cd qualification/vault_runtime_installed_ci
          sha256sum --check --strict source-checksums.sha256
          cd ../../components/usage-anchor
          sha256sum --check --strict ../../qualification/vault_runtime_installed_ci/witness-source.sha256
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install only the locked crypto test dependencies and create private state
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          state=$(mktemp -d "$HOME/pamolive-anchor-handoff-XXXXXXXX")
          mkdir -m 700 "$state/incoming"
          python -m venv "$state/venv"
          "$state/venv/bin/python" -m pip install --only-binary=:all: --no-deps --require-hashes -r requirements-p2-test-linux.lock
          printf 'ANCHOR_STATE=%s\n' "$state" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ env.ANCHOR_ARTIFACT_ID }}
          path: ${{ env.ANCHOR_STATE }}/incoming
          digest-mismatch: error
      - name: Restore and open the exact signed checkpoint in a fresh process
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          module=qualification/vault_runtime_installed_ci/witness_anchor_handoff.py
          "$ANCHOR_STATE/venv/bin/python" -I -B "$module" import "$ANCHOR_STATE/incoming" "$ANCHOR_STATE/store"
          "$ANCHOR_STATE/venv/bin/python" -I -B "$module" reopen "$ANCHOR_STATE/store" "$ANCHOR_STATE/receipt.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: witness-synthetic-handoff-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.ANCHOR_STATE }}/receipt.json
          if-no-files-found: error
          retention-days: 7
