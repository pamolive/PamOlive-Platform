name: P1-G Chromium and PostgreSQL loopback admission
on:
  push:
    branches: [agent/p1g-browser-postgres-namespace]
permissions:
  contents: read
jobs:
  sandbox-measurement:
    if: github.repository == 'pamolive/PamOlive-Platform'
    runs-on: ubuntu-22.04
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12.16'
      - name: Verify sandbox measurement source contracts
        run: >-
          python -B -m unittest
          qualification.p1g_headless.test_chrome_sandbox_probe
          qualification.p1g_headless.test_chrome_probe_stage
          qualification.p1g_headless.test_chrome_metadata
          qualification.p1g_headless.test_postgres_namespace
      - name: Install the public PostgreSQL client
        shell: bash
        run: |
          set -euo pipefail
          timeout 120s sudo -n /usr/bin/apt-get update -qq
          timeout 180s sudo -n /usr/bin/apt-get install -y --no-install-recommends postgresql-client
      - name: Prepare the pinned browser driver
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          python -m venv "$RUNNER_TEMP/pamolive-sandbox-venv"
          driver_python="$RUNNER_TEMP/pamolive-sandbox-venv/bin/python"
          "$driver_python" -m pip --isolated --disable-pip-version-check install --only-binary=:all: --no-deps --require-hashes -r qualification/p1g_headless/requirements-headless-linux-cp312.lock
          "$driver_python" -m pip check
      - name: Measure Chrome 158 and PostgreSQL from the private loopback namespace
        shell: bash
        env:
          P1G_SANDBOX_RUNNER: ubuntu-22.04
        run: |
          set -euo pipefail
          umask 077
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          "$RUNNER_TEMP/pamolive-sandbox-venv/bin/python" -I -B qualification/p1g_headless/chrome_sandbox_probe.py
      - name: Confirm the dedicated PostgreSQL container was removed
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          owner="$GITHUB_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          [[ "$owner" =~ ^[0-9a-f]{40}-[1-9][0-9]*-[1-9][0-9]*$ ]]
          remaining=$(timeout 8s /usr/bin/docker --host unix:///var/run/docker.sock ps --all --quiet --no-trunc --filter "label=io.pamolive.p1g-postgres=$owner")
          if test -n "$remaining"; then
            [[ "$remaining" =~ ^[0-9a-f]{64}$ ]]
            timeout 15s /usr/bin/docker --host unix:///var/run/docker.sock rm --force "$remaining"
            exit 42
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: p1g-browser-postgres-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pamolive-sandbox-${{ github.run_id }}-${{ github.run_attempt }}.json
          if-no-files-found: error
          retention-days: 7
