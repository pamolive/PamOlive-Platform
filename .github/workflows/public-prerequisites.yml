name: Public prerequisites DATA only

on:
  push:
    branches: [agent/public-env-root-helper]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public_prerequisites:
    if: github.repository == 'pamolive/PamOlive-Platform' && github.ref == 'refs/heads/agent/public-env-root-helper' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: |
            .github/workflows
            qualification/public_prerequisites_dispatch
            qualification/public_pg_identity_probe
      - name: Verify source pins and only pure source request-graph tests
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          source="$GITHUB_WORKSPACE/qualification/public_prerequisites_dispatch"
          printf '%s  %s\n' e568642367ad88cfaa50604beb9cefae5d6375f191a87015d14d3515ad7ff7a9 "$source/quick.py" | sha256sum --check --status
          printf '%s  %s\n' df0fd08281c900c233fc74da2372cda815f03045c9a0ee79e86838f4bc697f77 "$source/run_pure.py" | sha256sum --check --status
          printf '%s  %s\n' f0e711ff6e404e844700c8673cebe3fe35ea984ec70c6a114e0df0e840927e9a "$source/test_source.py" | sha256sum --check --status
          env -i PATH=/usr/bin:/bin HOME=/nonexistent LANG=C LC_ALL=C \
            /usr/bin/python3 -I -S -B "$source/run_pure.py" \
            "$RUNNER_TEMP/public-prerequisites-pure-${{ github.run_id }}-${{ github.run_attempt }}"
      - name: Observe public prerequisites and synthetic PG identity only
        timeout-minutes: 4
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          source="$GITHUB_WORKSPACE/qualification/public_prerequisites_dispatch"
          printf '%s  %s\n' e568642367ad88cfaa50604beb9cefae5d6375f191a87015d14d3515ad7ff7a9 "$source/quick.py" | sha256sum --check --status
          env -i PATH=/usr/bin:/bin HOME=/nonexistent LANG=C LC_ALL=C \
            GITHUB_ACTIONS=true CI=true RUNNER_ENVIRONMENT=github-hosted \
            RUNNER_TEMP="$RUNNER_TEMP" GITHUB_RUN_ID='${{ github.run_id }}' \
            GITHUB_RUN_ATTEMPT='${{ github.run_attempt }}' GITHUB_SHA='${{ github.sha }}' \
            GITHUB_REPOSITORY='${{ github.repository }}' GITHUB_EVENT_NAME='${{ github.event_name }}' GITHUB_REF='${{ github.ref }}' \
            GITHUB_JOB='${{ github.job }}' \
            /usr/bin/python3 -I -S -B "$source/quick.py" --payload-sha b15bfec328310d507de8e05fe4330020962a0133f66ca2845a42327f78c1a8af \
            --query-mode prerequisites-only --github-hosted-disposable-public-read
      - name: Retain only closed public DATA and lifecycle facts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: public-prerequisites-data-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/public-prerequisites-pure-${{ github.run_id }}-${{ github.run_attempt }}/report.json
            ${{ runner.temp }}/public-prerequisites-${{ github.run_id }}-${{ github.run_attempt }}/context.json
            ${{ runner.temp }}/public-prerequisites-${{ github.run_id }}-${{ github.run_attempt }}/intent.json
            ${{ runner.temp }}/public-prerequisites-${{ github.run_id }}-${{ github.run_attempt }}/public-report.json
            ${{ runner.temp }}/public-prerequisites-${{ github.run_id }}-${{ github.run_attempt }}/pull-intent.json
            ${{ runner.temp }}/public-prerequisites-${{ github.run_id }}-${{ github.run_attempt }}/pull-pid.json
            ${{ runner.temp }}/public-prerequisites-${{ github.run_id }}-${{ github.run_attempt }}/pull-process.json
            ${{ runner.temp }}/public-prerequisites-${{ github.run_id }}-${{ github.run_attempt }}/pull-result.json
            ${{ runner.temp }}/public-prerequisites-${{ github.run_id }}-${{ github.run_attempt }}/pull-unknown.json
            ${{ runner.temp }}/public-prerequisites-${{ github.run_id }}-${{ github.run_attempt }}/engine/public-report.json
            ${{ runner.temp }}/public-prerequisites-${{ github.run_id }}-${{ github.run_attempt }}/engine/root-read-intent.json
            ${{ runner.temp }}/public-prerequisites-${{ github.run_id }}-${{ github.run_attempt }}/engine/root-read-pid.json
            ${{ runner.temp }}/public-prerequisites-${{ github.run_id }}-${{ github.run_attempt }}/engine/root-read-result.json
            ${{ runner.temp }}/pamolive-pg-identity-${{ github.run_id }}-${{ github.run_attempt }}/public-report.json
          if-no-files-found: error
          retention-days: 7
