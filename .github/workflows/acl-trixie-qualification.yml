name: Coreutils sed and tar descriptor ACL qualification on Trixie

on:
  push:
    branches: [agent/acl-coreutils-descriptor-qualification]

permissions:
  contents: read

jobs:
  acl-trixie-amd64:
    if: github.repository == 'pamolive/PamOlive-Platform'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - name: Qualify coreutils sed and tar against the reviewed libacl
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          umask 077
          archive="$RUNNER_TEMP/pamolive-acl-context-$GITHUB_RUN_ID.tar"
          context="$RUNNER_TEMP/pamolive-acl-context-$GITHUB_RUN_ID"
          evidence="$RUNNER_TEMP/pamolive-acl-evidence-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          test ! -e "$evidence"
          (set -o noclobber; git archive "$GITHUB_SHA:qualification/acl_trixie_build" > "$archive")
          mkdir -m 700 "$context"
          tar --extract --file "$archive" --directory "$context" --no-same-owner
          docker build --platform=linux/amd64 --no-cache --progress=plain \
            --target coreutils-acl-qualification --output "type=local,dest=$evidence" "$context"
          cmp <(find "$evidence" -mindepth 1 -printf '%f\n' | LC_ALL=C sort) - <<'EXPECTED'
          baseline.json
          buildinfo
          candidate.json
          coreutils-stock.json
          coreutils.buildinfo
          coreutils.deb
          coreutils.json
          libacl1.deb
          qualification.json
          sed.buildinfo
          sed.deb
          sed.json
          tar.buildinfo
          tar.deb
          tar.json
          EXPECTED
          python3 -I -B -S "$context/compare.py" "$evidence" | cmp "$evidence/qualification.json" -
          expected=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["elf_sha256"])' "$evidence/qualification.json")
          actual=$(dpkg-deb --fsys-tarfile "$evidence/libacl1.deb" \
            | tar --extract --to-stdout --file - ./usr/lib/x86_64-linux-gnu/libacl.so.1.2.2400 \
            | sha256sum)
          test "$actual" = "$expected  -"
          for name in sed tar; do
            expected=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))[sys.argv[2] + "_sha256"])' "$evidence/$name.json" "$name")
            actual=$(dpkg-deb --fsys-tarfile "$evidence/$name.deb" \
              | tar --extract --to-stdout --file - "./usr/bin/$name" \
              | sha256sum)
            test "$actual" = "$expected  -"
          done
          for name in cp install mv; do
            expected=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["binaries"][sys.argv[2]]["sha256"])' "$evidence/coreutils.json" "$name")
            actual=$(dpkg-deb --fsys-tarfile "$evidence/coreutils.deb" \
              | tar --extract --to-stdout --file - "./usr/bin/$name" \
              | sha256sum)
            test "$actual" = "$expected  -"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: acl-trixie-qualification-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pamolive-acl-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 7
