name: pamolive-architecture

services:
  web:
    image: caddy@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648
    restart: unless-stopped
    user: "1000:1000"
    read_only: true
    cap_drop:
      - ALL
    # The existing Caddy binary has this file capability; keep it in the bounding
    # set so older Synology kernels permit execution under a non-root user.
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    environment:
      XDG_CONFIG_HOME: /tmp/caddy-config
      XDG_DATA_HOME: /tmp/caddy-data
    ports:
      - "192.168.0.25:8020:8080"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./architecture-platform.html:/srv/architecture-platform.html:ro
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m,mode=1777
    mem_limit: 96m
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/architecture-platform.html"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    logging:
      driver: json-file
      options:
        max-size: "1m"
        max-file: "2"
