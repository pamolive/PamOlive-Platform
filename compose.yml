services:
  web:
    build: .
    env_file: ${ENV_FILE:-.env}
    environment:
      DATABASE_URL: ${DATABASE_URL:?Configure DATABASE_URL vers PostgreSQL}
      SECRET_KEY: ${SECRET_KEY:?Configure SECRET_KEY}
    ports:
      - "${PAMOLIVE_PORT:-8001}:8000"
    restart: unless-stopped
    stop_grace_period: 20s
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - SETUID
      - SETGID
      - KILL
