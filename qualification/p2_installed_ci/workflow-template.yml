name: Public PAM verifier installed qualification
on:
  push:
    branches: [main, agent/p2-r1b1-public-verifier-a573]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: p2-public-verifier-installed-${{ github.ref }}
  cancel-in-progress: false
jobs:
  installed-public-verifier:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      P2_SOURCES_SHA: 5995e3852d3793609420277abcea65e5d2730f1085acfaaac58bbc1b4660d419
      P2_ASSETS_SHA: 4124bff9afa21db723b53c2e3a9467772a553d04b39598fb56d550ee0e9d5d29
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - name: Check runner source bytes before Python or network phases
        shell: bash
        run: |
          set -euo pipefail
          cd qualification/p2_installed_ci
          printf '%s  source-checksums.sha256\n' "$P2_SOURCES_SHA" | sha256sum --check --strict
          sha256sum --check --strict source-checksums.sha256
          printf 'P2_WORK=%s/pamolive-p2-installed-%s-%s\n' "$RUNNER_TEMP" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"
          printf 'P2_MATERIALS=%s/p2-public-materials-%s-%s\n' "$RUNNER_TEMP" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Pure runner guards only
        run: python -I -B qualification/p2_installed_ci/run_pure.py
      - name: Check all selected public payload and acquisition code before host acquisition
        run: python -I -B qualification/p2_installed_ci/controller.py verify --assets-sha256 "$P2_ASSETS_SHA" --work "$P2_WORK" --repository "$GITHUB_WORKSPACE"
      - name: Fifty-four pure metadata, installed-child diagnostics and adapter guards only
        run: python -I -B qualification/pam_trust_verifier/run_pure.py
      - name: Acquire exactly thirteen public wheels separately on host
        timeout-minutes: 32
        run: python -I -B qualification/pam_trust_verifier/acquire_materials.py acquire --plan-sha256 bc65c92ffc630e302515f7abc2dae60617231dfbb134fd6d58a39f26e781f36e --repository "$GITHUB_WORKSPACE" --destination "$P2_MATERIALS"
      - name: Prepare three closed public read-only input directories
        run: python -I -B qualification/p2_installed_ci/controller.py prepare --assets-sha256 "$P2_ASSETS_SHA" --work "$P2_WORK" --repository "$GITHUB_WORKSPACE" --materials "$P2_MATERIALS"
      - name: Pull only pinned public S0 on host
        timeout-minutes: 6
        run: python -I -B qualification/p2_installed_ci/controller.py pull --assets-sha256 "$P2_ASSETS_SHA" --work "$P2_WORK"
      - name: Installed thirty tests in confined network-none container
        timeout-minutes: 17
        run: python -I -B qualification/p2_installed_ci/controller.py run --assets-sha256 "$P2_ASSETS_SHA" --work "$P2_WORK"
      - name: Reconcile only own durable reservation; preserve failures
        if: always() && env.P2_WORK != ''
        timeout-minutes: 2
        run: python -I -B qualification/p2_installed_ci/controller.py cleanup --assets-sha256 "$P2_ASSETS_SHA" --work "$P2_WORK"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always() && env.P2_WORK != ''
        with:
          name: p2-installed-public-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.P2_WORK }}/public-report.json
          if-no-files-found: error
          retention-days: 7
