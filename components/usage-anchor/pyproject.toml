[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pamolive-usage-anchor"
version = "0.1.0a1"
description = "Independent usage/counter authority; no secret release"
readme = "README.md"
requires-python = ">=3.12"
license = "AGPL-3.0-or-later"
dependencies = [
  "cryptography==50.0.2", "webauthn==3.0.1", "cbor2==6.2.1",
  "psycopg==3.2.10",
  "psycopg-c==3.2.10; platform_system == 'Linux'",
  "psycopg-binary==3.2.10; platform_system != 'Linux'",
  "uvicorn==0.54.0",
  "pamolive-vault-contracts==0.1.0a1", "pamolive-pam-trust-verifier==0.1.0a1",
  "pamolive-vault-reservation-runtime==0.1.0a1",
]

[tool.setuptools]
packages = ["pamolive_usage_anchor"]

[tool.setuptools.data-files]
"share/pamolive/usage-anchor" = ["sql/schema.sql"]
