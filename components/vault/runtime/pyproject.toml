[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pamolive-vault-reservation-runtime"
version = "0.1.0a1"
description = "Internal reservation-only Vault runtime; no secret release authority"
readme = "README.md"
requires-python = ">=3.12"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
dependencies = [
    "cryptography==50.0.2",
    "pamolive-pam-trust-verifier==0.1.0a1",
    "pamolive-vault-contracts==0.1.0a1",
    "uvicorn==0.54.0",
]

[tool.setuptools]
packages = ["pamolive_vault_runtime"]
include-package-data = false

[tool.setuptools.data-files]
"share/pamolive/vault-reservation" = ["sql/schema.sql"]
